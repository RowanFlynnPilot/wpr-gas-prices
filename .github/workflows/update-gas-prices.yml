name: Update Gas Prices

on:
  schedule:
    # BACKUP schedule. The primary update now runs on Rowan's machine twice daily
    # (7am/7pm Central) via Windows Task Scheduler — see scripts/update-gas-prices.ps1
    # — because GasBuddy's Cloudflare hard-403s this datacenter IP but trusts a
    # residential one.
    #
    # These times are nominally clear of the local runs (local 7am/7pm Central =
    # 12:00/00:00 UTC in CDT, 13:00/01:00 in CST; 15:00/03:00 misses all four),
    # but GitHub cron drifts by HOURS under load (observed 6-12h, Aug 2026), so
    # collisions WILL happen despite the separation. Both runners tolerate them:
    # this job retries its push with -X ours, and the local script self-heals a
    # stuck rebase and retries with -X theirs. Cron is fixed UTC and ignores
    # DST, so local times also drift an hour seasonally.
    - cron: '0 15 * * *'   # 10am CDT / 9am CST
    - cron: '0 3 * * *'    # 10pm CDT / 9pm CST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scrape_gas_prices.py --output docs/gas_prices.json

      # Bake the fresh data into a static PNG for the email newsletter (email can't
      # embed the live widget). See scripts/render-digest.mjs.
      #
      # These run with `!cancelled()` rather than on success: the scraper is designed
      # to fail soft, but if it ever dies hard the digest must still be re-rendered
      # from whatever data is on disk — AAA and EIA may have refreshed even when
      # GasBuddy did not, and the newsletter image has to keep pace twice a day.
      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright
        if: ${{ !cancelled() }}
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Render newsletter digest image
        if: ${{ !cancelled() }}
        run: |
          python -m http.server 4180 --bind 127.0.0.1 --directory docs &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:4180/digest.html > /dev/null && break
            sleep 1
          done
          node scripts/render-digest.mjs http://127.0.0.1:4180/digest.html docs/digest.png

      - name: Commit and push updated data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add docs/gas_prices.json || true
          git add docs/gas_prices_history.json || true
          git add docs/eia_weekly.json || true
          git add docs/eia_context.json || true
          git add docs/digest.png || true
          if git diff --staged --quiet; then
            echo "No price changes detected, skipping commit."
          else
            git commit -m "Update gas prices — $(date -u +'%Y-%m-%d %H:%M UTC')"
            # The local runner may have pushed while this job scraped (cron
            # drift makes that a normal event). Its data is fresher and richer
            # (residential IP, full GasBuddy), so on a collision origin wins:
            # -X ours during a rebase favors origin/main, and our commit keeps
            # only what doesn't conflict.
            if ! git push; then
              echo "Push rejected — rebasing onto origin (origin wins conflicts) and retrying."
              git pull --rebase -X ours origin main
              git push
            fi
          fi

      - name: Alert on scrape failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="⚠️ Gas scraper needs attention"
          if [ -f docs/scrape_status.json ]; then
            read OK DEG FRESH TOTAL AAA <<< "$(python -c "import json;d=json.load(open('docs/scrape_status.json'));print(str(d.get('gasbuddy_success',False)).lower(), str(d.get('degraded',False)).lower(), d.get('cities_fresh',0), d.get('cities_total','?'), str(d.get('aaa_updated',False)).lower())")"
          else
            echo "No scrape_status.json — scraper crashed before writing status."
            OK=false; DEG=false; FRESH=0; TOTAL="?"; AAA=false
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')

          if [ "$OK" = "true" ] && [ "$DEG" != "true" ]; then
            echo "Healthy run ($FRESH/$TOTAL cities fresh)."
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "✅ Recovered — a healthy run ($FRESH/$TOTAL cities) succeeded ($RUN_URL). Auto-closing."
              gh issue close "$EXISTING"
            fi
            exit 0
          fi

          if [ "$OK" != "true" ]; then
            echo "GasBuddy scrape failed — alerting (aaa_updated=$AAA)."
            if [ "$AAA" = "true" ]; then
              SUMMARY="could not reach GasBuddy, so station and metro prices are carried forward from the last good run. AAA's statewide trend **did** refresh, so the widget's statewide numbers and blurb are current."
            else
              SUMMARY="could not reach GasBuddy **or** AAA. Every price on the widget is carried forward from the last good run."
            fi
            CAUSE="Most common cause: Cloudflare is 403ing the GitHub Actions datacenter IP on the CSRF-token fetch (the scraper rotates TLS fingerprints and entry URLs, but cannot defeat a pure IP-reputation block). Check the 'Run scraper' log — repeated 'CSRF fetch failed ... 403' means the IP is blocked, not that the site changed. If instead the token is fetched but cities return no data, GasBuddy changed its GraphQL shape (see scrape_gas_prices.py)."
          else
            echo "Degraded run ($FRESH/$TOTAL fresh) — alerting."
            SUMMARY="only scraped $FRESH of $TOTAL cities fresh; the rest fell back to carried-forward (stale) prices, and the statewide average was recomputed mostly from stale data."
            CAUSE="Usually transient GasBuddy rate-limiting of the GitHub Actions IP. Often self-corrects on the next run."
          fi
          BODY=$(printf '%s\n' \
            "The scheduled gas-price update $SUMMARY" "" \
            "Run: $RUN_URL" "" \
            "$CAUSE This issue closes itself automatically after a healthy run." )
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still unhealthy as of $(date -u +'%Y-%m-%d %H:%M UTC') ($FRESH/$TOTAL fresh). Run: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
