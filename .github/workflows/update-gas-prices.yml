name: Update Gas Prices

on:
  schedule:
    # This is now the PRIMARY update. It was demoted to a backup in Aug 2026 when
    # GasBuddy's Cloudflare hard-403'd this datacenter IP, but it has scraped all
    # 22 cities on every run since mid-August. The local runner
    # (scripts/update-gas-prices.ps1, 7am/7pm Central) stands by and only scrapes
    # when this job's data goes stale — running both is what got the residential
    # IP rate-limited on 2026-09-17.
    #
    # These times are nominally clear of the local runs (local 7am/7pm Central =
    # 12:00/00:00 UTC in CDT, 13:00/01:00 in CST; 15:00/03:00 misses all four),
    # but GitHub cron drifts by HOURS under load (observed 6-12h, Aug 2026), so
    # collisions WILL happen despite the separation. Both runners tolerate them:
    # this job retries its push with -X ours, and the local script self-heals a
    # stuck rebase and retries with -X theirs. Cron is fixed UTC and ignores
    # DST, so local times also drift an hour seasonally.
    - cron: '0 15 * * *'   # 10am CDT / 9am CST
    - cron: '0 3 * * *'    # 10pm CDT / 9pm CST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Two full GasBuddy scrapes close together (a workflow_dispatch soon after
      # the cron, or cron drift bunching runs) is what trips the per-IP rate limit.
      # If the published station data is under two hours old and complete, leave
      # it alone and let the scraper refresh only AAA / EIA / the digest.
      - name: Decide whether GasBuddy needs scraping
        run: |
          SKIP=$(python - <<'PY'
          import json, datetime as dt
          try:
              j = json.load(open('docs/gas_prices.json'))
              age = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(j['scraped_at'])).total_seconds() / 3600
              stale = sum(1 for m in j['metros'].values() if m.get('stale'))
              print('1' if age < 2 and stale == 0 else '0')
          except Exception:
              print('0')
          PY
          )
          if [ "$SKIP" = "1" ]; then
            echo "Published station data is under 2h old and complete — skipping the GasBuddy scrape."
            echo "SKIP_GASBUDDY=1" >> "$GITHUB_ENV"
          else
            echo "Scraping GasBuddy."
          fi

      - name: Run scraper
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scrape_gas_prices.py --output docs/gas_prices.json

      # Bake the fresh data into a static PNG for the email newsletter (email can't
      # embed the live widget). See scripts/render-digest.mjs.
      #
      # These run with `!cancelled()` rather than on success: the scraper is designed
      # to fail soft, but if it ever dies hard the digest must still be re-rendered
      # from whatever data is on disk — AAA and EIA may have refreshed even when
      # GasBuddy did not, and the newsletter image has to keep pace twice a day.
      - name: Set up Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The scraper's fresh output must satisfy what the widgets read (see
      # tests/data-contract.test.mjs). A failure here means a scraper change
      # altered the JSON shape: the previous data files are restored so nothing
      # broken is published, the digest renders from them, and the run alerts.
      - name: Check scraper output against the widget data contract
        if: ${{ !cancelled() }}
        run: |
          if node --test tests/data-contract.test.mjs; then
            echo "Fresh data satisfies the widget contract."
          else
            echo "::error::Scraper output failed the widget data contract — restoring the previously published data files."
            git checkout -- docs/gas_prices.json docs/gas_prices_history.json docs/eia_weekly.json docs/eia_context.json docs/eia_heating.json
            echo "CONTRACT_FAILED=1" >> "$GITHUB_ENV"
          fi

      - name: Install Playwright
        if: ${{ !cancelled() }}
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Render newsletter digest image
        id: render
        if: ${{ !cancelled() }}
        run: |
          python -m http.server 4180 --bind 127.0.0.1 --directory docs &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:4180/digest.html > /dev/null && break
            sleep 1
          done
          node scripts/render-digest.mjs http://127.0.0.1:4180/digest.html docs/digest.png

      - name: Commit and push updated data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add docs/gas_prices.json || true
          git add docs/gas_prices_history.json || true
          git add docs/eia_weekly.json || true
          git add docs/eia_context.json || true
          git add docs/eia_heating.json || true
          git add docs/digest.png || true
          if git diff --staged --quiet; then
            echo "No price changes detected, skipping commit."
          else
            git commit -m "Update gas prices — $(date -u +'%Y-%m-%d %H:%M UTC')"
            # The local runner may have pushed while this job scraped (cron
            # drift makes that a normal event). Its data is fresher and richer
            # (residential IP, full GasBuddy), so on a collision origin wins:
            # -X ours during a rebase favors origin/main, and our commit keeps
            # only what doesn't conflict.
            if ! git push; then
              echo "Push rejected — rebasing onto origin (origin wins conflicts) and retrying."
              git pull --rebase -X ours origin main
              git push
            fi
            echo "PUSHED=1" >> "$GITHUB_ENV"
          fi

      # Did the live site pick it up? scripts/verify-live.sh polls the published
      # JSON for the scraped_at we just committed and sets PUBLISH_FAILED=1 for the
      # alert step if a Pages deploy never delivers it.
      - name: Verify the live site
        if: ${{ !cancelled() && env.PUSHED == '1' }}
        env:
          PAGES_URL: https://rowanflynnpilot.github.io/wpr-gas-prices
        run: bash scripts/verify-live.sh

      # scripts/alert.sh decides whether the run needs a human and keeps one issue
      # about it; tests/workflow-scripts.test.sh drives every branch offline.
      - name: Alert on scrape failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST_OUTCOME: ${{ steps.render.outcome }}
        run: bash scripts/alert.sh

      # scripts/nudge.sh: a story heads-up for the newsroom (not an error alert),
      # one issue carrying the current move, updated only on a 5c+ change of
      # figure. Tested offline alongside alert.sh.
      - name: Nudge on notable price move
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/nudge.sh
