      seen.add(name);
      const m = ranked.find(q => q.name === name), [x, y] = pos[name];
      const w = textW(name + ' ', fs) + textW(money2(m.price), fs, 500);
      const tries = [
        [x + r + 4, y + fs * 0.35, 'start'], [x - r - 4 - (name === 'Wausau' ? 4 : 0), y + fs * 0.35, 'end'],
        [x, y - r - 6, 'middle'], [x, y + r + fs + 4, 'middle'],
      ];
      for (const [tx, ty, anchor] of tries) {
        const x0 = anchor === 'start' ? tx : anchor === 'end' ? tx - w : tx - w / 2;
        const b = { x0, x1: x0 + w, y0: ty - fs, y1: ty + 3, own: name };
        if (!clear(b, name)) continue;
        taken.push(b);
        svg += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}" class="wpr-map-lbl" style="font-size:${fs}px">${esc(name)} <tspan class="wpr-map-price" data-city="${esc(name)}">${money2(m.price)}</tspan></text>`;
        break;
      }
    }

    const scale = L.PRICE_BINS.map((label, i) => `<div><i style="background:${BIN_COLORS[i]}"></i>${label}</div>`).join('');
    const row = m => `<div class="wpr-map-rank-row${m.name === 'Wausau' ? ' me' : ''}"><span class="wpr-map-rank-dot" style="background:${BIN_COLORS[m.bin]}"></span><span class="wpr-map-rank-n">${esc(m.name)}</span><span class="wpr-map-rank-p">${moneyH(m.price)}</span></div>`;
    let callout = '';
    if (me) {
      const rel = me.price - avg;
      const where = Math.abs(rel) < 0.01 ? 'right at the state average' : `${L.centsText(rel)} ${rel > 0 ? 'above' : 'below'} the state average`;
      const st = (data.metros.Wausau.stations || []).filter(s => typeof s.prices?.[activeFuel] === 'number')
        .sort((a, b) => a.prices[activeFuel] - b.prices[activeFuel])[0];
      callout = `<div class="wpr-map-callout"><b>Wausau ${money2(me.price)}</b> — ${where}, #${ranked.indexOf(me) + 1} cheapest of ${ranked.length}.${st ? ` Cheapest nearby: <b>${esc(st.name)}</b> at ${money2(st.prices[activeFuel])}.` : ''}</div>`;
    }

    return `
      <div class="wpr-map">
        <div class="wpr-tr-kicker">${fuelLabel(activeFuel)} · state average ${money2(avg)}</div>
        <h3 class="wpr-tr-title">Where ${FUEL_WORD[activeFuel] || 'gas'} costs more, and less, than the state average</h3>
        <p class="wpr-tr-dek">${spreadPhrase(L.centsText(dear.price - cheap.price))} spread across the state: cheapest in <b>${esc(cheap.name)}</b> (${money2(cheap.price)}), priciest in <b>${esc(dear.name)}</b> (${money2(dear.price)}).</p>
        <div class="wpr-map-grid">
          <div>
            <svg viewBox="0 0 ${VW} ${VH}" class="wpr-map-svg" role="group" aria-label="Map of Wisconsin metro ${fuelLabel(activeFuel).toLowerCase()} prices compared with the state average">${svg}</svg>
            ${timelapseControls()}
            <div class="wpr-map-scale">${scale}</div>
          </div>
          <div class="wpr-map-side">
            <div class="wpr-map-rank">
              <div class="wpr-map-rank-h">Cheapest</div>${ranked.slice(0, 3).map(row).join('')}
              <div class="wpr-map-rank-h" style="margin-top:10px">Priciest</div>${ranked.slice(-3).reverse().map(row).join('')}
            </div>
            ${callout}
          </div>
        </div>
        ${buildStrip(ranked, avg, colW)}
      </div>`;
  }

  // Every metro on one price line, so the whole spread is visible in ~90px.
  function buildStrip(ranked, avg, W) {
    const H = 116, Lp = 18, Rp = 18, cy = 58, fs = 11.5;
    const lo0 = ranked[0].price, hi0 = ranked[ranked.length - 1].price;
    const step = (hi0 - lo0) <= 0.45 ? 0.1 : (hi0 - lo0) <= 1 ? 0.2 : 0.5;
    const lo = Math.floor(Math.min(lo0, avg) / step) * step, hi = Math.ceil(Math.max(hi0, avg) / step) * step;
    const X = v => Lp + (v - lo) / (hi - lo) * (W - Lp - Rp);
    let svg = `<line x1="${Lp}" x2="${W - Rp}" y1="${cy}" y2="${cy}" class="wpr-strip-axis"/>`;
    for (let v = lo; v <= hi + 1e-9; v += step) svg += `<text x="${X(v).toFixed(1)}" y="${H - 4}" text-anchor="middle" class="wpr-tr-ax" style="font-size:${fs}px">${money2(v)}</text>`;
    svg += `<line x1="${X(avg).toFixed(1)}" x2="${X(avg).toFixed(1)}" y1="${cy - 36}" y2="${cy + 26}" class="wpr-strip-avg"/>`
      + `<text x="${X(avg).toFixed(1)}" y="${cy - 41}" text-anchor="middle" class="wpr-tr-note" style="font-size:${fs - 1}px">State ${money2(avg)}</text>`;
    const placed = [];
    for (const m of ranked) {
      const x = X(m.price);
      const used = placed.filter(p => Math.abs(p.x - x) < 10).map(p => p.dy);
      const dy = [0, -10, 10, -20, 20].find(c => !used.includes(c)) ?? 0;
      placed.push({ x, dy });
      if (m.name === 'Wausau') svg += `<circle cx="${x.toFixed(1)}" cy="${cy + dy}" r="9" class="wpr-map-me"/>`;
      svg += `<circle cx="${x.toFixed(1)}" cy="${cy + dy}" r="5.5" fill="${BIN_COLORS[m.bin]}" class="wpr-map-dot" data-city="${esc(m.name)}"><title>${esc(m.name)} ${money2(m.price)}</title></circle>`;
    }
    const lab = (m, y, anchor) => {
      let x = X(m.price), a = anchor;
      if (x < 50) a = 'start'; else if (x > W - 50) a = 'end';
      return `<text x="${x.toFixed(1)}" y="${y}" text-anchor="${a}" class="wpr-map-lbl" style="font-size:${fs}px">${esc(m.name)}</text>`;
    };
    const me = ranked.find(m => m.name === 'Wausau');
    svg += lab(ranked[0], cy - 29, 'middle') + lab(ranked[ranked.length - 1], cy - 29, 'middle');
    if (me && me !== ranked[0] && me !== ranked[ranked.length - 1]) svg += lab(me, cy + 38, 'middle');
    return `<div class="wpr-strip"><div class="wpr-map-rank-h">All ${ranked.length} metros on one line</div>
      <svg viewBox="0 0 ${W} ${H}" class="wpr-strip-svg" role="img" aria-label="${esc(`${fuelLabel(activeFuel)} prices for ${ranked.length} metros, from ${money2(lo0)} in ${ranked[0].name} to ${money2(hi0)} in ${ranked[ranked.length - 1].name}; state average ${money2(avg)}`)}">${svg}</svg></div>`;
  }

  // ── Fill-up calculator ──
  // A reader's choice of vehicle and city is remembered in this browser only
  // (a convenience: everything works without storage, defaulting to Wausau).
  const store = {
    get(k, d) { try { return localStorage.getItem('wpr-gas-' + k) || d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('wpr-gas-' + k, v); } catch (e) { /* private mode */ } },
  };
  let fillVehicle = store.get('vehicle', 'sedan');
  let fillCity = store.get('city', 'Wausau');
  const usd = v => '$' + Math.abs(v).toFixed(2);
  const signedUsd = v => (v > 0.004 ? '+' : v < -0.004 ? '−' : '') + usd(v);

  function buildFillUp() {
    const metros = data?.metros || {};
    if (!metros[fillCity]) fillCity = metros.Wausau ? 'Wausau' : Object.keys(metros)[0];
    const vehicle = L.VEHICLES.find(v => v.key === fillVehicle) || L.VEHICLES[1];
    const f = L.fillUp({ metros, history: historyData, aaa: data?.aaa, city: fillCity, fuel: activeFuel, gallons: vehicle.gallons });
    if (!f) return '';
    const vBtns = L.VEHICLES.map(v =>
      `<button type="button" class="wpr-fill-veh ${v.key === vehicle.key ? 'active' : ''}" aria-pressed="${v.key === vehicle.key}" data-vehicle="${v.key}">${v.label}<span>${v.gallons} gal</span></button>`
    ).join('');
    const cityOpts = Object.keys(metros).sort().map(n => `<option value="${esc(n)}" ${n === fillCity ? 'selected' : ''}>${esc(n)}</option>`).join('');
    const tile = (label, value, cls, sub) =>
      `<div class="wpr-fill-tile"><div class="wpr-tr-tile-l">${label}</div><div class="wpr-fill-tile-v ${cls}">${value}</div><div class="wpr-tr-tile-s">${sub}</div></div>`;
    const cls = v => (v > 0.004 ? 'up-color' : v < -0.004 ? 'down-color' : '');
    const tiles = [
      f.week ? tile('Vs a week ago', signedUsd(f.week.diff), cls(f.week.diff), `same tank on ${L.shortDate(f.week.t)}`) : '',
      f.cheapest && f.cheapest.save >= 0.5   // a few cents is not worth a detour
        ? tile(`At ${esc(f.cheapest.name)}`, `${usd(f.cost - f.cheapest.save)}`, 'down-color', `save ${usd(f.cheapest.save)} at ${money2(f.cheapest.price)}/gal`)
        : '',
      f.year != null ? tile('Vs a year ago', signedUsd(f.year), cls(f.year), 'statewide change, per AAA') : '',
    ].filter(Boolean).join('');
    return `
      <div class="wpr-fill">
        <div class="wpr-tr-kicker">Fill-up calculator · ${fuelLabel(activeFuel)}</div>
        <h3 class="wpr-tr-title">Filling ${/^[AEIOU]/.test(vehicle.label) ? 'an' : 'a'} ${vehicle.label.toLowerCase().replace('suv', 'SUV')} in ${esc(f.city)} costs <span class="wpr-fill-cost">${usd(f.cost)}</span></h3>
        <div class="wpr-fill-controls">
          <div class="wpr-fill-vehs" role="group" aria-label="Vehicle">${vBtns}</div>
          <select class="wpr-state-city-select wpr-fill-city" id="fillCity" aria-label="City for the fill-up">${cityOpts}</select>
        </div>
        ${tiles ? `<div class="wpr-fill-tiles">${tiles}</div>` : ''}
        <p class="wpr-fill-note">A typical ${vehicle.gallons}-gallon tank at the ${esc(f.city)} average of ${money2(f.price)} a gallon. Your tank size and station will differ.</p>
      </div>`;
  }

  // ── Map time-lapse ──
  // Replays the last 60 days on the map: each frame re-colors the dots (and the
  // labelled prices) against that day's statewide average, from L.mapFrames().
  // Label positions stay where today's layout put them. Only the map changes; the
  // lists, the dek and the strip plot keep describing today.
  let tlFrames = null, tlFuel = null, tlTimer = 0;
  function framesFor(fuel) {
    if (tlFuel !== fuel) { tlFrames = historyData ? L.mapFrames(historyData, fuel, 60) : []; tlFuel = fuel; }
    return tlFrames;
  }
  function timelapseControls() {
    const frames = framesFor(activeFuel);
    if (frames.length < 10) return '';
    const n = frames.length - 1;
    return `
      <div class="wpr-tl" role="group" aria-label="Replay the last ${frames.length} days on the map">
        <button type="button" class="wpr-tl-play" aria-label="Play the last ${frames.length} days">▶</button>
        <input type="range" class="wpr-tl-range" min="0" max="${n}" value="${n}" step="1" aria-label="Day shown on the map">
        <span class="wpr-tl-day" aria-live="off">Today</span>
      </div>`;
  }
  function showFrame(i) {
    const frames = framesFor(activeFuel), f = frames[i];
    if (!f) return;
    const isToday = i === frames.length - 1;
    widget.querySelectorAll('.wpr-map-svg .wpr-map-dot[data-city]').forEach(dot => {
      const m = f.metros[dot.getAttribute('data-city')];
      dot.setAttribute('fill', m ? BIN_COLORS[m.bin] : '#ffffff');
      dot.classList.toggle('wpr-map-dot-none', !m);
      dot.classList.toggle('wpr-map-dot-carried', !!(m && m.carried));
    });
    widget.querySelectorAll('.wpr-map-svg .wpr-map-price[data-city]').forEach(t => {
      const m = f.metros[t.getAttribute('data-city')];
      t.textContent = m ? money2(m.price) : '—';
    });
    const day = widget.querySelector('.wpr-tl-day');
    if (day) day.innerHTML = isToday ? 'Today' : `${L.shortDate(f.t)} · state ${money2(f.avg)}`;
    const range = widget.querySelector('.wpr-tl-range');
    if (range && +range.value !== i) range.value = i;
    widget.querySelector('.wpr-map-svg')?.classList.toggle('wpr-map-past', !isToday);
  }
  function stopTimelapse() {
    clearInterval(tlTimer); tlTimer = 0;
    const btn = widget.querySelector('.wpr-tl-play');
    if (btn) { btn.textContent = '▶'; btn.setAttribute('aria-label', btn.getAttribute('aria-label').replace('Pause', 'Play')); }
  }
  function wireTimelapse() {
    stopTimelapse();
    const btn = widget.querySelector('.wpr-tl-play'), range = widget.querySelector('.wpr-tl-range');
    if (!btn || !range) return;
    const last = +range.max;
    range.addEventListener('input', () => { stopTimelapse(); showFrame(+range.value); });
    btn.addEventListener('click', () => {
      if (tlTimer) { stopTimelapse(); return; }
      let i = +range.value >= last ? 0 : +range.value;
      showFrame(i);
      btn.textContent = '❚❚';
      btn.setAttribute('aria-label', btn.getAttribute('aria-label').replace('Play', 'Pause'));
      // ~6s for 60 days; slower steps when the reader prefers less motion.
      tlTimer = setInterval(() => {
        i += 1;
        showFrame(i);
        if (i >= last) stopTimelapse();
      }, reduceMotion() ? 400 : 110);
    });
  }

  // Map and strip dots open that city's row (with its cheapest stations) in the list.
  function wireMetroMap() {
    widget.querySelectorAll('.wpr-map-dot[data-city]').forEach(dot => {
      const open = () => {
        expandedCity = dot.getAttribute('data-city');
        render();
        const card = [...widget.querySelectorAll('.wpr-metro-card[data-city]')].find(c => c.dataset.city === expandedCity);
        if (card) { card.scrollIntoView({ block: 'center' }); card.focus({ preventScroll: true }); }
      };
      dot.addEventListener('click', open);
      dot.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    });
  }

  // ── Home Heating Tab ──
  // Wisconsin residential propane and heating oil from EIA's weekly State Heating
  // Oil and Propane Program survey (October–March), plus monthly natural gas.
  // Statewide dealer averages — there is no per-city or per-station equivalent of
  // GasBuddy for these fuels, so the tab says so rather than implying a local quote.
  const HEATING_FUELS = {
    propane:     { label: 'Propane',     tank: 'a 500-gallon tank (filled to 80%, about 400 gallons)', gallons: 400 },
    heating_oil: { label: 'Heating oil', tank: 'a typical 275-gallon tank', gallons: 275 },
  };
  const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function longIsoDate(iso) {
    const t = L.isoTime(iso);
    if (isNaN(t)) return iso || '';
    const d = new Date(t);
    return `${MONTHS_SHORT[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`;
  }
  function monthYear(ym) {
    const t = L.isoTime(ym);
    if (isNaN(t)) return ym || '';
    const d = new Date(t);
    return `${d.toLocaleString('en-US', { month: 'long', timeZone: 'UTC' })} ${d.getUTCFullYear()}`;
  }
  // "4¢ higher than a year ago" / "$1.34 higher than a year ago" — whole cents below a
  // dollar, dollars at or above (matches the blurb's money()). `unit` suffixes the
  // amount for per-Mcf figures.
  function centsClause(cur, ref, phrase, unit = '') {
    if (typeof cur !== 'number' || typeof ref !== 'number') return '';
    const diff = cur - ref, cents = Math.round(Math.abs(diff) * 100);
    if (cents === 0) return `even with ${phrase}`;
    const amount = cents >= 100 ? `$${(cents / 100).toFixed(2)}` : `${cents}¢`;
    return `${amount}${unit} ${diff > 0 ? 'higher' : 'lower'} than ${phrase}`;
  }

  // Tank choice per fuel, remembered in this browser only (see `store`).
  const heatTank = {
    propane: +store.get('tank-propane', 500),
    heating_oil: +store.get('tank-heating_oil', 275),
  };
  const usd0 = v => '$' + Math.round(Math.abs(v)).toLocaleString('en-US');

  // Each card leads with the number a household acts on: what filling the tank
  // costs now and against a year ago. The per-gallon price and its moves follow.
  function renderHeatingCard(key) {
    const spec = HEATING_FUELS[key];
    const sum = L.heatingSummary(heatingData?.[key], Date.now());
    if (!sum) {
      return `<div class="wpr-heat-card"><div class="wpr-heat-card-label">${spec.label}</div>
        <div class="wpr-heat-card-empty">No data available</div></div>`;
    }
    const cur = sum.latest.price;
    // Week-over-week only within the same season — October's first reading must
    // not be compared against the previous March.
    const sameSeasonPrev = sum.prev && L.seasonOf(sum.prev.date) === sum.season ? sum.prev : null;
    const wk = sameSeasonPrev ? delta(cur, sameSeasonPrev.price, { cents: true }) : null;
    const yr = sum.yearAgo ? centsClause(cur, sum.yearAgo.price, 'a year ago') : '';
    const yrCls = !sum.yearAgo ? '' : cur > sum.yearAgo.price + 0.005 ? 'up-color' : cur < sum.yearAgo.price - 0.005 ? 'down-color' : 'flat-color';
    const tanks = L.HEATING_TANKS[key];
    const tank = tanks.find(t => t.gallons === heatTank[key]) || tanks[1] || tanks[0];
    const fill = L.fillCost(cur, tank.fill);
    const fillYr = sum.yearAgo ? L.fillCost(sum.yearAgo.price, tank.fill) : null;
    const fillDiff = fill != null && fillYr != null ? fill - fillYr : null;
    const tankBtns = tanks.map(t =>
      `<button type="button" class="wpr-heat-tank ${t === tank ? 'active' : ''}" aria-pressed="${t === tank}" data-tank="${key}:${t.gallons}">${t.gallons.toLocaleString('en-US')} gal</button>`
    ).join('');
    const fillNote = key === 'propane' ? `${tank.fill} gallons: a ${tank.gallons}-gallon tank filled to 80%` : `${tank.fill} gallons: a full ${tank.gallons}-gallon tank`;
    return `
      <div class="wpr-heat-card">
        <div class="wpr-heat-card-label">${spec.label} · fill-up</div>
        <div class="wpr-heat-card-value">${fill != null ? usd0(fill) : '—'}</div>
        ${fillDiff != null ? `<div class="wpr-heat-card-yoy ${fillDiff > 0 ? 'up-color' : fillDiff < 0 ? 'down-color' : 'flat-color'}">${fillDiff === 0 ? 'same as' : `${usd0(fillDiff)} ${fillDiff > 0 ? 'more' : 'less'} than`} a year ago</div>` : ''}
        <div class="wpr-heat-tanks" role="group" aria-label="${spec.label} tank size">${tankBtns}</div>
        <div class="wpr-heat-card-asof">${fillNote}</div>
        <div class="wpr-heat-card-row"><span>Price per gallon</span><b>${fmtCents(cur)} <span class="wpr-heat-card-unit">wk of ${L.shortDate(L.isoTime(sum.latest.date))}</span></b></div>
        <div class="wpr-heat-card-row"><span>vs previous week</span><b class="${wk ? wk.cls : 'flat-color'}">${wk ? wk.text : 'first reading of the season'}</b></div>
        <div class="wpr-heat-card-row"><span>vs a year ago</span><b class="${yrCls}">${yr ? yr.replace(' than a year ago', '') : '—'}</b></div>
      </div>`;
  }

  // This winter over last on a days-since-October-1 axis, drawn at the pixel
  // width it occupies like the other charts. The question a reader brings is
  // "is it worse than last year?", so the matching week of last winter is marked
  // and the gap between the two is labelled.
  function buildSeasonChart(series, label) {
    const sum = L.heatingSummary(series, Date.now());
    if (!sum) return '<div class="wpr-trends-empty">No data available.</div>';
    const cur = L.seasonPoints(series, sum.season);
    const prev = L.seasonPoints(series, sum.season - 1);
    if (cur.length + prev.length < 2) return '<div class="wpr-trends-empty">Not enough data yet this season.</div>';

    const W = frameW() - 2 * padX(), narrow = W < 460;
    const H = narrow ? 230 : 250, Lp = narrow ? 40 : 46, Rp = narrow ? 62 : 84, T = 14, B = 26, fs = 11.5;
    const DAYS = 182;   // 1 Oct → 1 Apr
    const all = [...cur, ...prev].map(p => p.price);
    const step = niceStep(Math.max(...all) - Math.min(...all));
    const lo = Math.floor(Math.min(...all) / step) * step;
    const hi = Math.max(Math.ceil(Math.max(...all) / step) * step, lo + 2 * step);
    const X = day => Lp + Math.min(Math.max(day, 0), DAYS) / DAYS * (W - Lp - Rp);
    const Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const path = pts => pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.day).toFixed(1)},${Y(p.price).toFixed(1)}`).join('');

    let svg = '';
    for (let v = lo; v <= hi + 1e-9; v += step) {
      svg += `<line x1="${Lp}" x2="${W - Rp + 4}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="wpr-tr-grid"/>`
        + `<text x="${Lp - 7}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" class="wpr-tr-ax" style="font-size:${fs}px">${money2(v)}</text>`;
    }
    [['Oct', 0], ['Nov', 31], ['Dec', 61], ['Jan', 92], ['Feb', 123], ['Mar', 151]].forEach(([m, d], i) => {
      const x = X(d);
      svg += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${H - B}" y2="${H - B + 4}" class="wpr-tr-tick"/>`;
      if (!narrow || i % 2 === 0) svg += `<text x="${(x + 3).toFixed(1)}" y="${H - 8}" class="wpr-tr-ax" style="font-size:${fs}px">${m}</text>`;
    });

    const lastCur = cur[cur.length - 1], lastPrev = prev[prev.length - 1];
    if (prev.length > 1) svg += `<path d="${path(prev)}" class="wpr-tr-bench"/>`;
    if (cur.length > 1) {
      svg += `<path d="${path(cur)}" class="wpr-tr-line wpr-draw" pathLength="1"/>`;
    }
    // Last winter's line is labelled where it ends (right margin).
    if (lastPrev) {
      svg += `<text x="${(X(lastPrev.day) + 8).toFixed(1)}" y="${(Y(lastPrev.price) + 4).toFixed(1)}" class="wpr-tr-note" style="font-size:${fs}px">${narrow ? 'Last yr' : L.seasonLabel(sum.season - 1)}</text>`;
    }
    if (lastCur) {
      const x = X(lastCur.day), y = Y(lastCur.price);
      const match = sum.inSeason ? L.sameWeekLastSeason(prev, lastCur.day) : null;
      svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" class="wpr-tr-enddot"/>`;
      // Everything sits to the right of the latest point: a bracket joining it to
      // the same week last winter, both prices beside their dots, and the gap in
      // the middle (or after last year's price when the two are close).
      // Late in the season the point is near the right edge: mirror to the left.
      const flip = x + 200 > W, sx = flip ? -1 : 1;
      const lbl = (yy, text, cls, size) => `<text x="${(x + sx * 18).toFixed(1)}" y="${(yy + 4).toFixed(1)}" text-anchor="${flip ? 'end' : 'start'}" class="${cls} wpr-tr-halo" style="font-size:${size}px">${text}</text>`;
      if (!match) {
        svg += lbl(y, `${money2(lastCur.price)} <tspan class="wpr-tr-note" style="font-weight:400">${sum.inSeason ? 'this week' : 'last reading'}</tspan>`, 'wpr-tr-endlbl', 12.5);
      } else {
        const my = Y(match.price), gap = lastCur.price - match.price, apart = Math.abs(y - my);
        let ty = y, my2 = my;
        if (apart < 30) { const mid = (y + my) / 2, dir = y <= my ? -1 : 1; ty = mid + dir * 15; my2 = mid - dir * 15; }
        svg += `<circle cx="${x.toFixed(1)}" cy="${my.toFixed(1)}" r="4.5" class="wpr-tr-benchdot"/>`
          + `<path d="M${(x + sx * 7).toFixed(1)},${y.toFixed(1)}H${(x + sx * 11).toFixed(1)}V${my.toFixed(1)}H${(x + sx * 7).toFixed(1)}" class="wpr-tr-bracket"/>`
          + lbl(ty, `${money2(lastCur.price)} <tspan class="wpr-tr-note" style="font-weight:400">this week</tspan>`, 'wpr-tr-endlbl', 12.5)
          + lbl(my2, `${money2(match.price)} same week last year${apart < 46 ? ` · <tspan style="font-weight:700">${signedCents(gap)}</tspan>` : ''}`, 'wpr-tr-note', fs);
        if (apart >= 46) svg += lbl((y + my) / 2, signedCents(gap), 'wpr-tr-endlbl', 13);
      }
    }
    // Invisible hit targets keep the per-week values one hover/tap away.
    const hits = pts => pts.map(p =>
      `<circle cx="${X(p.day).toFixed(1)}" cy="${Y(p.price).toFixed(1)}" r="7" fill="transparent" class="wpr-chart-hit"><title>${longIsoDate(p.date)}: ${money2(p.price)}</title></circle>`).join('');
    svg += hits(prev) + hits(cur);
    const aria = `${label} this winter compared with last winter, October through March.` + (lastCur ? ` Latest ${money2(lastCur.price)} a gallon.` : '');
    return `
      <div class="wpr-tr-legend">
        <span><i class="wpr-tr-sw"></i>${L.seasonLabel(sum.season)}${sum.inSeason ? ' · this winter' : ''}</span>
        ${prev.length ? `<span><i class="wpr-tr-sw wpr-tr-sw-dash"></i>${L.seasonLabel(sum.season - 1)} · last winter</span>` : ''}
      </div>
      <svg viewBox="0 0 ${W} ${H}" class="wpr-tr-svg" role="img" aria-label="${esc(aria)}">${svg}</svg>`;
  }

  // Natural gas is monthly and ~3 months late: a dated figure with a 13-month line.
  function gasSparkline(series) {
    const pts = (series || []).filter(p => typeof p.price === 'number' && !isNaN(L.isoTime(p.date)))
      .sort((a, b) => L.isoTime(a.date) - L.isoTime(b.date)).slice(-13);
    if (pts.length < 4) return '';
    const w = 110, h = 26, pad = 3;
    const lo = Math.min(...pts.map(p => p.price)), hi = Math.max(...pts.map(p => p.price)), r = (hi - lo) || 1;
    const c = pts.map((p, i) => `${(pad + i * (w - 2 * pad) / (pts.length - 1)).toFixed(1)},${(pad + (h - 2 * pad) * (1 - (p.price - lo) / r)).toFixed(1)}`);
    const [ex, ey] = c[c.length - 1].split(',');
    return `<svg class="wpr-heat-gas-spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Natural gas, last ${pts.length} months">`
      + `<polyline points="${c.join(' ')}" fill="none" stroke="var(--accent-dark)" stroke-width="1.6" stroke-linejoin="round"/>`
      + `<circle cx="${ex}" cy="${ey}" r="2.6" fill="var(--accent-dark)"/></svg>`;
  }

  function renderHeating() {
    if (!heatingData) {
      return '<div class="wpr-trends-empty">Heating fuel data is temporarily unavailable.</div>';
    }
    const sums = Object.fromEntries(Object.keys(HEATING_FUELS).map(k => [k, L.heatingSummary(heatingData[k], Date.now())]));
    const anchor = sums.propane || sums.heating_oil;
    const banner = anchor && !anchor.inSeason ? `
      <div class="wpr-heat-banner">The weekly heating-fuel survey runs <strong>October through March</strong>.
        Showing last winter's final readings (week of ${longIsoDate(anchor.latest.date)}); this winter's first reading arrives in early October.</div>` : '';
    const story = L.heatingStory(Object.entries(HEATING_FUELS).map(([k, s]) => ({ label: s.label, sum: sums[k] })));

    const fuelBtns = Object.entries(HEATING_FUELS).map(([k, s]) =>
      `<button type="button" aria-pressed="${heatingFuel === k}" class="wpr-gas-fuel-btn ${heatingFuel === k ? 'active' : ''}" data-heat="${k}">${s.label}</button>`
    ).join('');

    const gas = L.heatingSummary(heatingData.natural_gas, Date.now());
    const gasStrip = gas ? `
      <div class="wpr-heat-gas">
        <div>
          <div class="wpr-map-rank-h">Natural gas · residential · monthly</div>
          <div class="wpr-heat-gas-v">$${gas.latest.price.toFixed(2)}<span class="wpr-heat-card-unit">/Mcf</span>
            <span class="wpr-heat-gas-s">${monthYear(gas.latest.date)}${gas.yearAgo ? ` · ${centsClause(gas.latest.price, gas.yearAgo.price, 'a year ago', '/Mcf')}` : ''}</span></div>
        </div>
        ${gasSparkline(heatingData.natural_gas)}
      </div>
      <div class="wpr-heat-note">Natural gas is a monthly statewide figure published about three months late; utility bills also carry fixed charges not included here.</div>` : '';

    return `
      ${story ? `
        <div class="wpr-tr wpr-st-story" style="padding-top:14px">
          <div class="wpr-tr-kicker">Home heating · Wisconsin residential · weekly via U.S. EIA</div>
          <h3 class="wpr-tr-title">${esc(story.headline)}</h3>
          <p class="wpr-tr-dek">${esc(story.dek)}</p>
        </div>` : ''}
      ${banner}
      <div class="wpr-heat-grid">${renderHeatingCard('propane')}${renderHeatingCard('heating_oil')}</div>
      <div class="wpr-gas-fuel-row">${fuelBtns}</div>
      <div class="wpr-tr">
        <div class="wpr-tr-kicker">${HEATING_FUELS[heatingFuel].label} · this winter vs last</div>
        ${buildSeasonChart(heatingData[heatingFuel], HEATING_FUELS[heatingFuel].label)}
      </div>
      ${gasStrip}
      <div class="wpr-heat-note">Statewide averages from a weekly dealer survey (EIA State Heating Oil and Propane Program). Your delivered price depends on your dealer, contract, and delivery size — there is no per-city or per-dealer public data for these fuels.</div>
    `;
  }

  // ── Init ──
  async function init() {
    try {
      const [dataResp, histResp, ctxResp, heatResp, notesResp] = await Promise.all([
        fetchJson(DATA_URL + cacheBust()),
        fetchJson(HISTORY_URL + cacheBust()),
        fetchJson(EIA_CONTEXT_URL + cacheBust()),
        fetchJson(EIA_HEATING_URL + cacheBust()),
        fetchJson(NOTES_URL + cacheBust()),
      ]);
      data = dataResp;
      historyData = histResp;
      contextData = ctxResp;
      heatingData = heatResp;
      notesData = notesResp;
    } catch (err) {
      data = null;
    }
    render();
  }

  // Re-post height when the embed width changes (reflow) or fonts finish loading.
  let lastFrameW = null, resizeTimer = 0;
  window.addEventListener('resize', () => {
    postHeight();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (data && lastFrameW !== null && frameW() !== lastFrameW) render();
    }, 150);
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(postHeight);

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
