<style>

  :root {
    --ink: #1a1a1a; --ink-mid: #444; --ink-light: #5f5f5f; --ink-faint: #6a6a6a;
    --paper: #f9fafb; --paper-warm: #f0f5f4;
    --rule: #c8d8d5; --rule-light: #dfe9e7;
    --accent: #3e847a; --accent-light: #5ab8ad; --accent-pale: #e0f2ef; --accent-dark: #2d6259;
    --up: #c0392b; --down: #27864a; --neutral: #888; --radius: 6px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  .wpr-gas { font-variant-numeric:lining-nums tabular-nums; font-family:'DM Sans',-apple-system,sans-serif; background:var(--paper); color:var(--ink); max-width:720px; margin:0 auto; border:1px solid var(--rule); border-radius:10px; overflow:hidden; line-height:1.45; box-shadow:0 6px 24px rgba(20,50,45,0.09); }

  /* Loading placeholder in the widget's own shape, so the first paint isn't a
     line of text that jumps to a full widget. Replaced by the first render(). */
  .wpr-skel-head { background:var(--ink); height:96px; }
  .wpr-skel-bar { height:44px; background:var(--paper-warm); border-bottom:1px solid var(--rule); }
  .wpr-skel-body { padding:16px; display:grid; gap:12px; }
  .wpr-skel-b { border-radius:6px; background:linear-gradient(90deg,#eceff0 25%,#f5f7f7 50%,#eceff0 75%) 0 0/200% 100%; animation:wpr-skel 1.4s ease-in-out infinite; }
  @keyframes wpr-skel { from { background-position:100% 0; } to { background-position:-100% 0; } }
  @media (prefers-reduced-motion: reduce) { .wpr-skel-b { animation:none; } }
  .wpr-gas-header { background:var(--ink); color:#fff; position:relative; }
  .wpr-gas-header::after { content:''; position:absolute; bottom:0; left:0; right:0; height:4px; background:linear-gradient(90deg,var(--accent),var(--accent-light)); }
  .wpr-gas-header-top { display:flex; justify-content:space-between; align-items:center; padding:14px 18px; gap:12px; }
  .wpr-gas-header-left { display:flex; align-items:center; gap:12px; }
  .wpr-gas-logo { width:56px; height:56px; border-radius:50%; border:2px solid rgba(255,255,255,0.15); }
  .wpr-gas-kicker { font-size:9px; font-weight:600; letter-spacing:1.8px; text-transform:uppercase; color:var(--accent-light); }
  .wpr-gas-title { font-family:'Playfair Display',Georgia,serif; font-size:20px; font-weight:700; line-height:1.15; }
  .wpr-gas-date { font-size:11px; color:rgba(255,255,255,0.45); margin-top:5px; padding-left:4px; font-style:italic; }
  .wpr-gas-date-stale { color:#f0b65a; font-style:normal; }
  .wpr-gas-unavailable { text-align:center; padding:48px 20px; color:var(--ink-light); font-size:14px; line-height:1.7; }
  .wpr-gas-hero-price { text-align:right; min-width:130px; }
  .wpr-gas-hero-label { font-size:9px; text-transform:uppercase; letter-spacing:0.8px; color:rgba(255,255,255,0.5); }
  .wpr-gas-hero-value { font-family:'Playfair Display',Georgia,serif; font-size:38px; font-weight:700; line-height:1; }
  .wpr-gas-hero-change { font-size:11px; font-weight:600; margin-top:2px; }
  .wpr-gas-hero-change .up { color:#ff8a80; }
  .wpr-gas-hero-change .down { color:#81c995; }
  .wpr-gas-hero-change .flat { color:rgba(255,255,255,0.4); }
  .wpr-dollar { font-family:'Source Sans 3',sans-serif; font-weight:inherit; }

  .wpr-gas-tabs { display:flex; background:var(--paper-warm); border-bottom:1px solid var(--rule); }
  .wpr-gas-tab { flex:1; text-align:center; padding:10px 0; font-size:13px; font-weight:500; color:var(--ink-light); cursor:pointer; border:none; background:none; border-bottom:2.5px solid transparent; transition:all 0.15s; }
  .wpr-gas-tab:hover { color:var(--accent); background:var(--accent-pale); border-bottom-color:var(--accent-light); }
  .wpr-gas-tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; background:none; }

  .wpr-gas-fuel-row { display:flex; flex-wrap:wrap; gap:6px; padding:12px 14px 8px; justify-content:center; }
  .wpr-gas-fuel-btn { font-family:'DM Sans',sans-serif; font-size:12px; font-weight:600; padding:6px 18px; border-radius:100px; border:1.5px solid var(--rule); background:#fff; color:var(--ink-mid); cursor:pointer; transition:all 0.18s; box-shadow:0 1px 2px rgba(0,0,0,0.04); }
  .wpr-gas-fuel-btn:hover { border-color:var(--accent); color:var(--accent); box-shadow:0 2px 6px rgba(62,132,122,0.15); transform:translateY(-1px); }
  .wpr-gas-fuel-btn.active { background:linear-gradient(135deg, var(--accent-dark), var(--accent)); color:#fff; border-color:var(--accent-dark); box-shadow:0 2px 8px rgba(62,132,122,0.3); }

  .wpr-summary { margin:12px 14px 2px; padding:10px 12px; background:var(--paper-warm); border-left:3px solid var(--accent); border-radius:4px; display:flex; gap:10px; align-items:flex-start; }
  .wpr-summary-text { font-size:12px; color:var(--ink-mid); line-height:1.5; flex:1; }
  .wpr-summary-copy { flex-shrink:0; font-family:'DM Sans',sans-serif; font-size:10px; font-weight:600; color:var(--accent); background:#fff; border:1px solid var(--rule); border-radius:4px; padding:4px 9px; cursor:pointer; transition:all 0.12s; }
  .wpr-summary-copy:hover { border-color:var(--accent); background:var(--accent-pale); }
  .wpr-state-grid { display:grid; grid-template-columns:1fr 1.18fr 1fr; gap:8px; padding:14px 14px 10px; align-items:stretch; }
  .wpr-state-card { background:#fff; border:1px solid var(--rule-light); border-radius:var(--radius); padding:14px 8px; text-align:center; box-shadow:0 1px 3px rgba(20,50,45,0.05); display:flex; flex-direction:column; justify-content:center; }
  .wpr-state-card-feature { background:linear-gradient(165deg,var(--accent-pale),#ffffff 75%); border-color:var(--accent-light); box-shadow:0 4px 12px rgba(62,132,122,0.18); }
  .wpr-state-card-label { font-size:9px; text-transform:uppercase; letter-spacing:0.7px; color:var(--ink-faint); margin-bottom:5px; font-weight:700; }
  .wpr-state-card-feature .wpr-state-card-label { color:var(--accent-dark); }
  .wpr-state-card-value { font-family:'Playfair Display',Georgia,serif; font-size:22px; font-weight:700; line-height:1; }
  .wpr-state-card-feature .wpr-state-card-value { font-size:30px; }
  .wpr-state-card-sub { font-size:10px; margin-top:4px; color:var(--ink-light); }
  .wpr-pin { font-size:7px; vertical-align:middle; margin-right:3px; }
  .wpr-state-card-station { font-size:9px; color:var(--ink-faint); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wpr-state-range { padding:20px 18px 14px; }
  .wpr-state-range-bar { background:var(--rule-light); border-radius:10px; height:10px; position:relative; margin:4px 0; }
  .wpr-state-range-fill { background:linear-gradient(90deg,var(--down),var(--accent),var(--up)); border-radius:10px; height:100%; position:absolute; left:0; width:100%; opacity:0.9; }
  .wpr-state-range-marker { position:absolute; top:-4px; width:3px; height:18px; background:var(--ink); border-radius:2px; transform:translateX(-50%); z-index:2; }
  .wpr-state-range-marker-city { position:absolute; top:50%; width:15px; height:15px; background:var(--accent); border:3px solid #fff; border-radius:50%; transform:translate(-50%, -50%); z-index:3; box-shadow:0 1px 4px rgba(0,0,0,0.35); }
  .wpr-state-range-tag { position:absolute; transform:translateX(-50%); font-size:9px; font-weight:600; white-space:nowrap; padding:1px 6px; border-radius:4px; z-index:4; }
  .wpr-state-range-tag-state { bottom:calc(100% + 7px); background:var(--ink); color:#fff; }
  .wpr-state-range-tag-state::after { content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:3px solid transparent; border-top-color:var(--ink); }
  .wpr-state-range-tag-city { top:calc(100% + 9px); background:var(--accent); color:#fff; }
  .wpr-state-range-tag-city::before { content:''; position:absolute; bottom:100%; left:50%; transform:translateX(-50%); border:3px solid transparent; border-bottom-color:var(--accent); }
  .wpr-state-range-labels { display:flex; justify-content:space-between; font-size:10px; color:var(--ink-faint); margin-top:3px; }
  .wpr-state-section-label { font-size:9px; text-transform:uppercase; letter-spacing:0.8px; color:var(--ink-faint); font-weight:700; text-align:center; padding:2px 14px 0; }
  .wpr-ctx-strip { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px 20px; padding:10px 14px 2px; margin:8px 12px 0; border-top:1px solid var(--rule-light); }
  .wpr-ctx-strip-flush { border-top:none; margin-top:0; padding-top:4px; }
  .wpr-ctx-item { display:flex; align-items:baseline; gap:6px; }
  .wpr-ctx-label { font-size:9px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-faint); font-weight:700; }
  .wpr-ctx-value { font-family:'Playfair Display',Georgia,serif; font-size:15px; font-weight:700; }
  .wpr-ctx-unit { font-size:9px; color:var(--ink-faint); font-weight:400; }
  .wpr-ctx-rel { font-size:10px; font-weight:600; }
  .wpr-state-city-select-wrap { padding:4px 14px 14px; }
  .wpr-state-city-select { font-family:'DM Sans',sans-serif; font-size:12px; width:100%; padding:8px 12px; border:1.5px solid var(--rule); border-radius:var(--radius); background:#fff; color:var(--ink); cursor:pointer; appearance:auto; }
  .wpr-state-city-select:hover { border-color:var(--accent); }
  .wpr-state-city-select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-pale); }
  .wpr-state-city-label { font-size:10px; color:var(--ink-faint); text-align:center; margin-bottom:3px; }

  .wpr-sort-row { display:flex; justify-content:flex-end; align-items:center; gap:2px; padding:0 14px; }
  .wpr-sort-label { font-size:9px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-faint); font-weight:700; margin-right:4px; }
  .wpr-sort-btn { font-family:'DM Sans',sans-serif; font-size:11px; font-weight:500; color:var(--ink-light); background:none; border:none; border-bottom:1.5px solid transparent; padding:3px 6px; cursor:pointer; transition:color 0.12s, border-color 0.12s; }
  .wpr-sort-btn:hover { color:var(--accent); }
  .wpr-sort-btn:focus-visible { outline:2px solid var(--accent-light); outline-offset:1px; border-radius:3px; }
  .wpr-sort-btn.active { color:var(--accent-dark); font-weight:700; border-bottom-color:var(--accent); }
  .wpr-metro-list { padding:8px 14px 14px; }
  .wpr-metro-item { margin-bottom:6px; }
  .wpr-metro-card { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border:1px solid var(--rule-light); border-radius:var(--radius); background:#fff; box-shadow:0 1px 3px rgba(20,50,45,0.05); transition:border-color 0.12s, box-shadow 0.12s; }
  .wpr-metro-card.clickable { cursor:pointer; }
  .wpr-metro-card.clickable:hover { border-color:var(--accent); box-shadow:0 3px 10px rgba(62,132,122,0.14); }
  .wpr-metro-card.clickable:focus-visible { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-pale); }
  .wpr-metro-card.expanded { border-radius:var(--radius) var(--radius) 0 0; border-bottom-color:transparent; box-shadow:none; }
  .wpr-metro-card.highlight { background:var(--accent-pale); border-color:var(--accent); }
  .wpr-metro-name { font-size:13px; font-weight:600; }
  .wpr-metro-right { text-align:right; display:flex; align-items:center; gap:12px; }
  .wpr-metro-price { font-family:'Playfair Display',Georgia,serif; font-size:22px; font-weight:700; }
  .wpr-metro-range { font-size:10px; color:var(--ink-faint); }
  .wpr-metro-delta { font-size:11px; font-weight:600; min-width:55px; text-align:right; }
  .wpr-metro-spark { flex-shrink:0; opacity:0.85; }
  .wpr-metro-expand { font-size:9px; color:var(--ink-faint); width:10px; text-align:center; flex-shrink:0; }
  .wpr-metro-stations { background:var(--paper-warm); border:1px solid var(--accent); border-top:none; border-radius:0 0 var(--radius) var(--radius); padding:4px 14px 10px; }
  .wpr-metro-stations-head { font-size:9px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-faint); font-weight:700; padding:8px 0 4px; }
  .wpr-metro-station { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 0; border-top:1px solid var(--rule-light); }
  .wpr-metro-station:first-of-type { border-top:none; }
  .wpr-metro-station-info { display:flex; flex-direction:column; min-width:0; }
  .wpr-metro-station-name { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wpr-metro-station-addr { font-size:10px; color:var(--ink-light); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  a.wpr-metro-station-addr { text-decoration:none; }
  a.wpr-metro-station-addr:hover, a.wpr-metro-station-addr:focus-visible { color:var(--accent-dark); text-decoration:underline; outline:none; }
  .wpr-metro-station-price { font-family:'Playfair Display',Georgia,serif; font-size:15px; font-weight:700; color:var(--accent-dark); flex-shrink:0; }
  .up-color { color:var(--up); } .down-color { color:var(--down); } .flat-color { color:var(--neutral); }

  /* Statewide comparison bars */

  .wpr-trends-btn-row { justify-content:center; }
  .wpr-trends-btn-divider { display:inline-block; width:1px; height:20px; background:var(--rule); margin:0 4px; align-self:center; }
  .wpr-trends-title { font-family:'Playfair Display',Georgia,serif; font-size:16px; font-weight:700; color:var(--ink); text-align:center; padding:4px 0 12px; letter-spacing:-0.2px; }
  .wpr-trends-chart-wrap { padding:0 10px 10px; }
  .wpr-trends-legend { display:flex; justify-content:center; gap:16px; padding:2px 0 6px; font-size:10px; color:var(--ink-light); font-weight:600; }
  .wpr-trends-legend-item { display:flex; align-items:center; gap:5px; }
  .wpr-trends-legend-swatch { display:inline-block; width:14px; height:3px; border-radius:2px; }
  .wpr-trends-svg { width:100%; height:auto; }
  .wpr-trends-empty { text-align:center; padding:40px 10px; color:var(--ink-faint); font-style:italic; font-size:13px; }
  .wpr-chart-axis-label { font-size:9px; fill:var(--ink-faint); font-family:'DM Sans',sans-serif; }

  /* Home Heating tab */
  .wpr-heat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:12px 14px 4px; }
  .wpr-heat-card { background:#fff; border:1px solid var(--rule-light); border-radius:var(--radius); padding:14px 14px 12px; box-shadow:0 1px 3px rgba(20,50,45,0.05); min-width:0; }
  .wpr-heat-card-label { font-size:9px; text-transform:uppercase; letter-spacing:0.7px; color:var(--ink-faint); font-weight:700; }
  .wpr-heat-card-unit { font-family:'DM Sans',sans-serif; font-size:11px; font-weight:400; color:var(--ink-faint); margin-left:2px; }
  .wpr-heat-card-asof { font-size:10px; color:var(--ink-faint); margin-top:2px; }
  .wpr-heat-card-empty { font-size:12px; color:var(--ink-faint); font-style:italic; padding:14px 0; }
  .wpr-heat-card-row { display:flex; justify-content:space-between; gap:8px; font-size:11px; color:var(--ink-light); margin-top:7px; }
  .wpr-heat-card-row b { font-weight:600; text-align:right; }
  .wpr-heat-card-value { font-family:'Playfair Display',Georgia,serif; font-size:32px; font-weight:700; line-height:1.05; margin-top:4px; color:var(--ink); }
  .wpr-heat-card-yoy { font-size:12px; font-weight:700; margin-top:2px; }
  .wpr-heat-tanks { display:flex; flex-wrap:wrap; gap:5px; margin:9px 0 3px; }
  .wpr-heat-tank { font-family:'DM Sans',sans-serif; font-size:11px; font-weight:600; color:var(--ink-mid); background:var(--paper-warm); border:1.5px solid var(--rule-light); border-radius:14px; padding:3px 9px; cursor:pointer; }
  .wpr-heat-tank.active { background:var(--accent-dark); border-color:var(--accent-dark); color:#fff; }
  .wpr-heat-tank:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .wpr-heat-card-row:first-of-type { margin-top:9px; padding-top:8px; border-top:1px solid var(--rule-light); }
  .wpr-heat-gas { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:8px 16px 4px; padding:12px 14px; border:1px solid var(--rule-light); border-radius:var(--radius); background:#fff; }
  .wpr-heat-gas-v { font-family:'Playfair Display',Georgia,serif; font-size:22px; font-weight:700; margin-top:2px; }
  .wpr-heat-gas-s { display:block; font-family:'DM Sans',sans-serif; font-size:11.5px; font-weight:500; color:var(--ink-light); margin-top:2px; }
  .wpr-heat-gas-spark { flex:none; }
  .wpr-heat-banner { margin:10px 14px 0; padding:9px 12px; background:#fdf6e7; border:1px solid #e8cf9a; border-radius:4px; font-size:11.5px; line-height:1.5; color:#7a5b1e; }
  .wpr-heat-note { text-align:center; font-size:10px; color:var(--ink-faint); padding:2px 18px 12px; line-height:1.45; }
  .wpr-trends-legend-dashed { background:none; border-top:2px dashed var(--ink-light); height:0; }
  .wpr-chart-hit:hover { fill:var(--accent-pale); }

  /* Motion: entrance only (.wpr-enter is set when the view changes) */
  @keyframes wpr-draw { from { stroke-dashoffset:1; } to { stroke-dashoffset:0; } }
  @keyframes wpr-grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @keyframes wpr-rise { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
  .wpr-enter .wpr-draw { stroke-dasharray:1; animation:wpr-draw 0.9s cubic-bezier(0.33,1,0.68,1) both; }
  .wpr-enter .wpr-ladder-bar { animation:wpr-grow 0.6s cubic-bezier(0.33,1,0.68,1) both; }
  .wpr-enter .wpr-ladder-row:nth-child(3) .wpr-ladder-bar { animation-delay:0.06s; }
  .wpr-enter .wpr-ladder-row:nth-child(4) .wpr-ladder-bar { animation-delay:0.12s; }
  .wpr-enter .wpr-ladder-row:nth-child(5) .wpr-ladder-bar { animation-delay:0.18s; }
  .wpr-enter .wpr-tr-enddot, .wpr-enter .wpr-tr-endlbl, .wpr-enter .wpr-tr-note, .wpr-enter .wpr-tr-bracket { animation:wpr-rise 0.4s 0.7s ease-out both; }
  @media (prefers-reduced-motion: reduce) {
    .wpr-enter .wpr-draw, .wpr-enter .wpr-ladder-bar, .wpr-enter .wpr-tr-enddot, .wpr-enter .wpr-tr-endlbl, .wpr-enter .wpr-tr-note, .wpr-enter .wpr-tr-bracket { animation:none; }
  }
  /* Statewide: headline + 30-day line, change ladder */
  .wpr-st-story { padding-top:2px; padding-bottom:4px; }
  .wpr-st-chips { display:inline-flex; gap:6px; margin-left:4px; vertical-align:1px; flex-wrap:wrap; }
  .wpr-st-chip { font-size:11px; padding:1px 8px; border-radius:10px; background:#fff; border:1px solid var(--rule-light); white-space:nowrap; }
  .wpr-st-chip b { font-weight:600; color:var(--ink-light); }
  .wpr-st-spark { margin-top:2px; }
  .wpr-ladder { padding:2px 16px 6px; }
  .wpr-ladder-row { display:grid; grid-template-columns:92px 48px 1fr 62px; align-items:center; gap:10px; padding:4px 0; border-bottom:1px solid var(--rule-light); font-size:12px; }
  .wpr-ladder-row:last-child { border-bottom:0; }
  .wpr-ladder-label { color:var(--ink-mid); font-weight:500; }

    <div class="wpr-skel-head"></div><div class="wpr-skel-bar"></div>
    <div class="wpr-skel-body">

      <div class="wpr-skel-b" style="height:26px;width:85%"></div>

      <div class="wpr-skel-b" style="height:150px"></div>
    </div>
  </div>

<noscript>
  <div class="wpr-gas" style="text-align:center;padding:40px;color:var(--ink-light);font-family:'DM Sans',sans-serif;">
    This interactive gas-price widget needs JavaScript.<br>
    See current Wisconsin prices at
    <a href="https://www.gasbuddy.com/gasprices/wisconsin" style="color:var(--accent)">GasBuddy</a>.
  </div>

<!-- Shared, unit-tested logic. Bump ?v= whenever its API changes (see the file's header). -->
<script src="./widget-logic.js?v=10"></script>
<script src="./wi-outline.js?v=1"></script>
<script>
(function() {
  'use strict';

  const DATA_URL = './gas_prices.json';
  const HISTORY_URL = './gas_prices_history.json';
  const EIA_DATA_URL = './eia_weekly.json';
  const EIA_CONTEXT_URL = './eia_context.json';
  const EIA_HEATING_URL = './eia_heating.json';
  const NOTES_URL = './annotations.json';
  // Cache-bust in 10-min buckets so the GitHub Pages CDN doesn't serve stale JSON.
  const cacheBust = () => '?t=' + Math.floor(Date.now() / 600000);
  // Every fetch gives up after 15s: a request that neither succeeds nor fails
  // (flaky mobile networks) used to leave the widget on "Loading…" forever
  // instead of the honest "unavailable" state that outright failures get.
  const FETCH_TIMEOUT_MS = 15000;
  const fetchJson = url => fetch(url, { signal: AbortSignal.timeout ? AbortSignal.timeout(FETCH_TIMEOUT_MS) : undefined })
    .then(r => r.ok ? r.json() : null).catch(() => null);

    const WPR_LOGO = './wpr-logo.jpg';   // shared with the digest and social cards; cached once

  let data = null;
  let historyData = null;
  let notesData = null;   // docs/annotations.json, hand-edited by the newsroom
  let contextData = null;
  let heatingData = null;
  let heatingFuel = 'propane';
  let activeFuel = 'regular';
  let activeTab = 'statewide';
  let selectedCity = '';
  let expandedCity = '';
  let metroSort = 'featured';
  const widget = document.getElementById('gasWidget');

  // ── EIA ──
  let eiaCache = {};
  let eiaAllData = null;
  let trendRange = 26;

  // Links can open a specific view, so a story can embed or link straight to it:
  //   ?tab=heating   ?tab=metro&fuel=diesel   ?tab=trends&range=12   ?tab=heating&heat=heating_oil
  // Unknown values are ignored (the default view shows), never an error.
  (function applyViewFromUrl() {
    let q;
    try { q = new URLSearchParams(location.search); } catch (e) { return; }
    const pick = (key, allowed) => { const v = (q.get(key) || '').toLowerCase().replace('-', '_'); return allowed.includes(v) ? v : null; };
    activeTab = pick('tab', ['statewide', 'metro', 'trends', 'heating']) || activeTab;
    activeFuel = pick('fuel', ['regular', 'mid_grade', 'premium', 'diesel']) || activeFuel;
    heatingFuel = pick('heat', ['propane', 'heating_oil']) || heatingFuel;
    const range = pick('range', ['6', '12']);
    if (range) trendRange = range === '12' ? 52 : 26;
  })();

  // The Midwest benchmark. If it can't be fetched the chart shows Wisconsin alone
  // (the widget never draws stale or sample numbers as if they were live).
  async function loadEIAData() {
    if (eiaAllData) return;
    eiaAllData = (await fetchJson(EIA_DATA_URL + cacheBust())) || {};
    eiaCache = {};
  }

  function getEIAEntries(fuel) {
    if (eiaCache[fuel]) return eiaCache[fuel];
    const raw = (eiaAllData || {})[fuel];
    if (!raw || !raw.length) return null;
    const entries = raw.map(d => ({ date: new Date(d.date), price: d.price }));
    entries.sort((a, b) => a.date - b.date);
    eiaCache[fuel] = entries;
    return entries;
  }

  // Wisconsin statewide daily series from our own history file — overlaid on the
  // EIA Midwest weekly benchmark in the Trends chart.
  function getWIEntries(fuel) {
    if (!historyData) return null;
    const out = [];
    for (const k of historyKeysSorted()) {
      const v = historyData[k]?.statewide?.[fuel];
      if (typeof v === 'number') out.push({ date: new Date(historyKeyTime(k)), price: v });
    }
    return out.length >= 2 ? out : null;
  }

  // ── Helpers ──
  function fmt(p) {
    if (p == null) return '—';
    return '<span class="wpr-dollar">$</span>' + p.toFixed(3);
  }
  // The Metro list shows cents, the way a pump does; the statewide figures keep
  // three decimals, where a tenth of a cent is a real move in a 22-city average.
  function fmtCents(p) {
    if (p == null) return '—';
    return '<span class="wpr-dollar">$</span>' + p.toFixed(2);
  }
  function fmtHero(p) {
    if (p == null) return '—';
    return '<span class="wpr-dollar">$</span>' + p.toFixed(2);
  }
  function fuelLabel(k) {
    return { regular:'Regular', mid_grade:'Mid-Grade', premium:'Premium', diesel:'Diesel' }[k] || k;
  }
  // Pure logic lives in widget-logic.js (tested by tests/widget-logic.test.mjs);
  // these bind it to this widget's state. Without it nothing below can run, so
  // fail the same honest way a missing data file does.
  if (!self.WprGasLogic) {
    widget.innerHTML = '<div class="wpr-gas-unavailable">Live gas prices are temporarily unavailable.<br>Please check back shortly.</div>';
    return;
  }
  const L = self.WprGasLogic;
  const esc = L.esc;
  const delta = L.delta;
  const historyKeyTime = L.historyKeyTime;
  const historyKeysSorted = () => L.sortedHistoryKeys(historyData);
  const previousReading = (key, fuel) => L.previousReading(historyData, data?.price_date, key, fuel);
  const comparisonLabel = prevKey => L.comparisonLabel(data?.price_date, prevKey);
  const freshnessLabel = () => L.freshness(data.scraped_at, data.price_date, Date.now());

  // A period's statewide value from AAA's table (today/yesterday/week/month/year).
  // AAA is the statewide-trend source; GasBuddy stays the live station/metro source.
  function aaaPeriodValue(periodKey, fuel) {
    return data?.aaa?.[periodKey]?.[fuel] ?? null;
  }

  // ── Render ──
  // Tell the embedding page our current height so the iframe can auto-fit
  // (docs/embed.js listens). Posts now AND on the next frame: background tabs
  // never run requestAnimationFrame, so a rAF-only post leaves a WordPress page
  // opened in a background tab stuck at the iframe's fallback height.
  function sendHeight() {
    const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h > 0) window.parent.postMessage({ type: 'wpr-gas-height', height: h }, '*');
  }
  function postHeight() {
    if (window.parent === window) return; // not embedded
    sendHeight();
    requestAnimationFrame(sendHeight);
  }
  // embed.js pings when it attaches: this iframe can finish rendering before the
  // host page's async script is listening, and would otherwise never re-post.
  window.addEventListener('message', e => {
    if (e.source === window.parent && e.data === 'wpr-gas-height?') postHeight();
  });

  // ── Motion ──
  // Entrance motion runs only when the view changes (lastView), never on a
  // redraw from a resize or a select, and not at all under reduced motion.
  let lastView = '', firstRender = true;
  const reduceMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // The header price counts from the previous reading to today's on first load.
  function countUpHero(from, to) {
    const el = widget.querySelector('.wpr-gas-hero-value');
    if (!el || typeof from !== 'number' || typeof to !== 'number' || reduceMotion() || Math.abs(to - from) < 0.005) return;
    const t0 = performance.now(), dur = 900;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.innerHTML = fmtHero(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
    // Background tabs don't run rAF: make sure the final figure lands regardless.
    setTimeout(() => { el.innerHTML = fmtHero(to); }, dur + 100);
  }

  // Tiny inline trend line for a metro row, from recent history (F5).
  function metroSparkline(name, fuel) {
    if (!historyData) return '';
    const keys = historyKeysSorted();
    const vals = [];
    for (const k of keys) {
      const v = historyData[k]?.[name]?.[fuel];
      if (typeof v === 'number') vals.push(v);
    }
    const pts = vals.slice(-14);
    if (pts.length < 3) return '';
    const w = 60, h = 20, pad = 2;
    const min = Math.min(...pts), max = Math.max(...pts);
    const range = max - min || 1;
    const stepX = (w - pad * 2) / (pts.length - 1);
    const coords = pts.map((p, i) => {
      const x = pad + i * stepX;
      const y = pad + (h - pad * 2) * (1 - (p - min) / range);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    const trend = pts[pts.length - 1] - pts[0];
    const color = trend > 0.001 ? 'var(--up)' : trend < -0.001 ? 'var(--down)' : 'var(--neutral)';
    return `<svg class="wpr-metro-spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${fuelLabel(fuel)} ${pts.length}-point trend for ${name}"><polyline points="${coords}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
  }

  // Quiet error state when live data can't be loaded (F3).
  function renderError() {
    widget.innerHTML = `
      <div class="wpr-gas-header"><div class="wpr-gas-header-top"><div class="wpr-gas-header-left">
        <img src="${WPR_LOGO}" alt="Wausau Pilot &amp; Review" class="wpr-gas-logo" />
        <div>
          <div class="wpr-gas-kicker">Fuel Watch</div>
          <div class="wpr-gas-title">Wisconsin Gas Prices</div>
        </div>
      </div></div></div>
      <div class="wpr-gas-unavailable">
        Live gas prices are temporarily unavailable.<br>Please check back shortly.
      </div>
      <div class="wpr-gas-footer">
        <span>Data via <a href="https://www.gasbuddy.com/gasprices/wisconsin" target="_blank" rel="noopener">GasBuddy</a></span>
        <span>Wausau Pilot &amp; Review</span>
      </div>`;
    postHeight();
  }

  function render() {
    if (!data) { renderError(); return; }
    const fresh = freshnessLabel();
    const sw = data.statewide;
    const currentPrice = sw?.current_avg?.[activeFuel];
    const prev = previousReading('statewide', activeFuel);
    const d = delta(currentPrice, prev?.price ?? null, { cents: true });
    const heroFuelName = fuelLabel(activeFuel);
    const hasYesterday = prev != null;
    const heroCompare = hasYesterday ? comparisonLabel(prev.key) : '';

    let html = `
      <div class="wpr-gas-header">
        <div class="wpr-gas-header-top">
          <div class="wpr-gas-header-left">
            <img src="${WPR_LOGO}" alt="Wausau Pilot &amp; Review" class="wpr-gas-logo" />
            <div>
              <div class="wpr-gas-kicker">Fuel Watch</div>
              <div class="wpr-gas-title">Wisconsin Gas Prices</div>
              <div class="wpr-gas-date${fresh.stale ? ' wpr-gas-date-stale' : ''}" title="${fresh.title}">${fresh.text}</div>
            </div>
          </div>
          <div class="wpr-gas-hero-price">
            <div class="wpr-gas-hero-label">State Avg · ${heroFuelName}</div>
            <div class="wpr-gas-hero-value">${fmtHero(currentPrice)}</div>
            <div class="wpr-gas-hero-change">${hasYesterday
              ? `<span class="${d.cls === 'up-color' ? 'up' : d.cls === 'down-color' ? 'down' : 'flat'}">${d.text} ${heroCompare}</span>`
              : '<span class="flat">—</span>'
            }</div>
          </div>
        </div>
      </div>
      <div class="wpr-gas-tabs" role="tablist" aria-label="Gas price views">
        ${[['statewide', 'Statewide'], ['metro', 'By Metro Area'], ['trends', 'Price Trends'], ['heating', 'Home Heating']].map(([k, label]) =>
          `<button type="button" role="tab" id="wpr-tab-${k}" aria-controls="wpr-panel" aria-selected="${activeTab === k}" tabindex="${activeTab === k ? 0 : -1}" class="wpr-gas-tab ${activeTab === k ? 'active' : ''}" data-tab="${k}">${label}</button>`).join('')}
      </div>
    `;

    const view = `${activeTab}|${activeFuel}|${trendRange}|${heatingFuel}`;
    const entering = view !== lastView;
    lastView = view;
    html += `<div role="tabpanel" id="wpr-panel" aria-labelledby="wpr-tab-${activeTab}" aria-live="polite"${entering ? ' class="wpr-enter"' : ''}>`;
    if (activeTab === 'statewide') html += renderStatewide();
    else if (activeTab === 'metro') html += renderMetro();
    else if (activeTab === 'heating') html += renderHeating();
    else html += renderTrends();
    html += '</div>';

    const sourceCredit = activeTab === 'trends'
      ? `Midwest region data via <a href="https://www.eia.gov/petroleum/gasdiesel/" target="_blank" rel="noopener">U.S. Energy Information Administration</a>`
      : activeTab === 'heating'
      ? `Heating fuel data via <a href="https://www.eia.gov/petroleum/heatingoilpropane/" target="_blank" rel="noopener">U.S. Energy Information Administration</a>`
      : `Data via <a href="https://www.gasbuddy.com/gasprices/wisconsin" target="_blank" rel="noopener">GasBuddy</a>`;

    html += `<div class="wpr-gas-footer"><span>${sourceCredit}</span><span>Wausau Pilot &amp; Review</span></div>`;
    // Map dots keep their previous colors for one frame so a fuel change fades
    // between the two pictures instead of snapping.
    const prevFills = {};
    widget.querySelectorAll('.wpr-map-svg .wpr-map-dot[data-city]').forEach(d => { prevFills[d.getAttribute('data-city')] = d.getAttribute('fill'); });
    // Any redraw (including the Trends tab's second one when its data arrives)
    // keeps keyboard focus on the element that had it, matched by id.
    const focusedId = widget.contains(document.activeElement) ? document.activeElement.id : '';
    widget.innerHTML = html;
    if (focusedId) widget.querySelector('#' + CSS.escape(focusedId))?.focus({ preventScroll: true });
    if (Object.keys(prevFills).length && !reduceMotion()) {
      const dots = [...widget.querySelectorAll('.wpr-map-svg .wpr-map-dot[data-city]')];
      const next = dots.map(d => d.getAttribute('fill'));
      dots.forEach(d => { const f = prevFills[d.getAttribute('data-city')]; if (f) d.setAttribute('fill', f); });
      // A timer, not requestAnimationFrame: background tabs never run rAF, and the
      // dots would keep the previous fuel's colors.
      void widget.offsetWidth;
      setTimeout(() => dots.forEach((d, i) => d.setAttribute('fill', next[i])), 20);
    }
    if (firstRender) { firstRender = false; countUpHero(prev?.price, currentPrice); }

    // Tabs follow the ARIA tabs pattern: one tab stop, arrow keys / Home / End move
    // between tabs and select them, and focus stays on the selected tab after the
    // redraw (render() rebuilds the DOM).
    const tabs = [...widget.querySelectorAll('.wpr-gas-tab')];
    const selectTab = (k, focus) => {
      activeTab = k; render();
      if (focus) widget.querySelector(`#wpr-tab-${k}`)?.focus();
    };
    tabs.forEach((t, i) => {
      t.addEventListener('click', () => selectTab(t.dataset.tab, true));
      t.addEventListener('keydown', e => {
        const to = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
        if (to === undefined) return;
        e.preventDefault();
        selectTab(tabs[(to + tabs.length) % tabs.length].dataset.tab, true);
      });
    });
    widget.querySelectorAll('.wpr-gas-fuel-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.fuel) { activeFuel = btn.dataset.fuel; render(); }
        if (btn.dataset.range) { trendRange = parseInt(btn.dataset.range); eiaCache = {}; render(); }
        if (btn.dataset.heat) { heatingFuel = btn.dataset.heat; render(); }
      });
    });
    widget.querySelectorAll('.wpr-sort-btn').forEach(btn => {
      btn.addEventListener('click', () => { metroSort = btn.dataset.sort; render(); });
    });
    const citySelect = widget.querySelector('#citySelect');
    if (citySelect) {
      citySelect.addEventListener('change', () => { selectedCity = citySelect.value; render(); });
    }
    widget.querySelectorAll('.wpr-metro-card.clickable').forEach(c => {
      const toggle = () => { expandedCity = expandedCity === c.dataset.city ? '' : c.dataset.city; render(); };
      c.addEventListener('click', toggle);
      c.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });
    });
    wireTrendChart();
    wireMetroMap();
    wireTimelapse();
    widget.querySelectorAll('.wpr-fill-veh').forEach(b => b.addEventListener('click', () => {
      fillVehicle = b.dataset.vehicle; store.set('vehicle', fillVehicle); render();
      widget.querySelector(`.wpr-fill-veh[data-vehicle="${fillVehicle}"]`)?.focus({ preventScroll: true });
    }));
    widget.querySelectorAll('.wpr-heat-tank').forEach(b => b.addEventListener('click', () => {
      const [fuel, gal] = b.dataset.tank.split(':');
      heatTank[fuel] = +gal; store.set('tank-' + fuel, gal); render();
      widget.querySelector(`.wpr-heat-tank[data-tank="${b.dataset.tank}"]`)?.focus({ preventScroll: true });
    }));
    const fillSel = widget.querySelector('#fillCity');
    if (fillSel) fillSel.addEventListener('change', () => {
      fillCity = fillSel.value; store.set('city', fillCity); render();
      widget.querySelector('#fillCity')?.focus({ preventScroll: true });
    });
    lastFrameW = frameW();
    const copyBtn = widget.querySelector('.wpr-summary-copy');
    if (copyBtn && data.summary && data.summary.blurb) {
      copyBtn.addEventListener('click', () => {
        const done = () => { copyBtn.textContent = 'Copied!'; setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(data.summary.blurb).then(done).catch(() => {});
        }
      });
    }
    postHeight();
  }

  // National benchmark + crude context (EIA). WI-vs-US shows for Regular only
  // (the national series is regular gasoline); WTI crude is fuel-agnostic.
  function renderContextStrip() {
    if (!contextData) return '';
    const items = [];
    const wi = data.statewide?.current_avg?.regular;
    const nat = contextData.national_regular;
    if (activeFuel === 'regular' && wi != null && nat != null) {
      const diff = wi - nat;
      const cents = Math.round(Math.abs(diff) * 100);
      const rel = diff < -0.005 ? `${cents}¢ below` : diff > 0.005 ? `${cents}¢ above` : 'even with';
      const cls = diff < -0.005 ? 'down-color' : diff > 0.005 ? 'up-color' : 'flat-color';
      items.push(`<span class="wpr-ctx-item"><span class="wpr-ctx-label">U.S. avg</span><span class="wpr-ctx-value">${fmtCents(nat)}</span><span class="wpr-ctx-rel ${cls}">WI ${rel}</span></span>`);
    }
    if (contextData.wti != null) {
      items.push(`<span class="wpr-ctx-item"><span class="wpr-ctx-label">WTI crude</span><span class="wpr-ctx-value">$${contextData.wti.toFixed(2)}<span class="wpr-ctx-unit">/bbl</span></span></span>`);
    }
    return items.length ? `<div class="wpr-ctx-strip" title="Source: U.S. EIA">${items.join('')}</div>` : '';
  }

  // Neighboring-state comparison (AAA vs AAA, so it's apples-to-apples with the
  // Wisconsin AAA current average, not the GasBuddy hero number).
  function renderNeighborStrip() {
    const states = data?.neighbors?.states;
    const wiCur = data?.aaa?.current?.[activeFuel];
    if (!states) return '';
    const items = [];
    for (const code of ['MN', 'IA', 'IL', 'MI']) {
      const st = states[code];
      const p = st?.current?.[activeFuel];
      if (p == null) continue;
      let rel = '';
      if (wiCur != null) {
        const diff = p - wiCur;
        const cents = Math.round(Math.abs(diff) * 100);
        const cls = diff > 0.005 ? 'up-color' : diff < -0.005 ? 'down-color' : 'flat-color';
        const sign = diff > 0.005 ? '+' : diff < -0.005 ? '−' : '±';
        rel = `<span class="wpr-ctx-rel ${cls}">${sign}${cents}¢</span>`;
      }
      items.push(`<span class="wpr-ctx-item" title="${st.name}"><span class="wpr-ctx-label">${code}</span><span class="wpr-ctx-value">${fmtCents(p)}</span>${rel}</span>`);
    }
    if (!items.length) return '';
    return `
      <div class="wpr-state-section-label">Across the border · vs Wisconsin avg · via AAA</div>
      <div class="wpr-ctx-strip wpr-ctx-strip-flush">${items.join('')}</div>`;
  }

  // ── Statewide Tab ──
  // The first screen every reader sees. Leads with a headline and a 30-day line
  // from WPR's own daily statewide readings (the header's source too), then
  // today's spread across stations, then AAA's longer comparisons as bars around
  // zero: the old version drew each price as a bar from zero, which mostly
  // showed that prices are positive.
  function statewideSeries(fuel) {
    return (getWIEntries(fuel) || []).map(e => ({ t: e.date.getTime(), price: e.price }));
  }

  function buildStateSpark(series, W) {
    const lastT = series[series.length - 1].t;
    const pts = series.filter(p => p.t >= lastT - 30 * DAY_MS);
    if (pts.length < 3) return '';
    const narrow = W < 460;
    const H = 104, T = 12, B = 20, Lp = 2, R = narrow ? 58 : 70, fs = 11.5;
    const t0 = pts[0].t;
    const lo = Math.min(...pts.map(p => p.price)), hi = Math.max(...pts.map(p => p.price));
    const padY = Math.max((hi - lo) * 0.18, 0.02);
    const X = t => Lp + (t - t0) / ((lastT - t0) || 1) * (W - Lp - R);
    const Y = v => T + (1 - (v - (lo - padY)) / ((hi - lo) + 2 * padY)) * (H - T - B);
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)},${Y(p.price).toFixed(1)}`).join('');
    const first = pts[0], last = pts[pts.length - 1];
    const lowP = pts.reduce((a, p) => (p.price < a.price ? p : a), pts[0]);
    const highP = pts.reduce((a, p) => (p.price > a.price ? p : a), pts[0]);
    let svg = `<path d="${line}L${X(lastT).toFixed(1)},${H - B}L${X(t0).toFixed(1)},${H - B}Z" class="wpr-tr-area"/>`
      + `<line x1="${Lp}" x2="${W - R + 4}" y1="${H - B}" y2="${H - B}" class="wpr-tr-tick"/>`
      + `<path d="${line}" class="wpr-tr-line wpr-draw" pathLength="1"/>`;
    // Mark the 30-day high and low unless they are the endpoints (already labelled).
    for (const [p, word, dy] of [[highP, 'High', -8], [lowP, 'Low', 16]]) {
      if (p === last || p === first) continue;
      const x = X(p.t), y = Y(p.price);
      const anchor = x < 60 ? 'start' : x > W - R - 60 ? 'end' : 'middle';
      svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" class="wpr-tr-lowdot"/>`
        + `<text x="${x.toFixed(1)}" y="${(y + dy).toFixed(1)}" text-anchor="${anchor}" class="wpr-tr-note" style="font-size:${fs - 1}px">${word} ${money2(p.price)}</text>`;
    }
    const ex = X(last.t), ey = Y(last.price);
    svg += `<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="5" class="wpr-tr-enddot"/>`
      + `<text x="${(ex + 10).toFixed(1)}" y="${(ey + 1).toFixed(1)}" class="wpr-tr-endlbl" style="font-size:13px">${money2(last.price)}</text>`
      + `<text x="${(ex + 10).toFixed(1)}" y="${(ey + 15).toFixed(1)}" class="wpr-tr-note" style="font-size:${fs - 1}px">today</text>`
      + `<text x="${Lp}" y="${H - 6}" class="wpr-tr-ax" style="font-size:${fs - 0.5}px">${L.shortDate(first.t)}</text>`
      + `<text x="${(W - R).toFixed(1)}" y="${H - 6}" text-anchor="end" class="wpr-tr-ax" style="font-size:${fs - 0.5}px">${L.shortDate(last.t)}</text>`;
    const aria = `${fuelLabel(activeFuel)} statewide average over the last 30 days, from ${money2(first.price)} on ${L.shortDate(first.t)} to ${money2(last.price)} today; high ${money2(highP.price)}, low ${money2(lowP.price)}.`;
    return `<svg viewBox="0 0 ${W} ${H}" class="wpr-tr-svg wpr-st-spark" role="img" aria-label="${esc(aria)}">${svg}</svg>`;
  }

  // AAA's statewide table as change-since bars around zero (AAA vs AAA, so the
  // comparison is internally consistent even though the header is GasBuddy).
  function buildChangeLadder() {
    const now = aaaPeriodValue('current', activeFuel);
    if (now == null) return '';
    const rows = [['yesterday', 'Yesterday'], ['week_ago', 'A week ago'], ['month_ago', 'A month ago'], ['year_ago', 'A year ago']]
      .map(([k, label]) => ({ label, then: aaaPeriodValue(k, activeFuel) }))
      .filter(r => r.then != null)
      .map(r => ({ ...r, c: Math.round((now - r.then) * 100) }));
    if (!rows.length) return '';
    const maxC = Math.max(...rows.map(r => Math.abs(r.c)), 1);
    // Zero sits at the edge when every change has the same sign, so the bars use
    // the whole track; it moves to the middle only when there are both.
    const zero = rows.every(r => r.c >= 0) ? 0 : rows.every(r => r.c <= 0) ? 100 : 50;
    const span = zero === 50 ? 50 : 100;
    const html = rows.map(r => {
      const w = (Math.abs(r.c) / maxC * span).toFixed(1);
      const cls = r.c > 0 ? 'up' : r.c < 0 ? 'down' : 'flat';
      const text = r.c === 0 ? 'no change' : `${r.c > 0 ? '+' : '−'}${L.centsText(r.c / 100)}`;
      return `
        <div class="wpr-ladder-row">
          <span class="wpr-ladder-label">${r.label}</span>
          <span class="wpr-ladder-then">${money2(r.then)}</span>
          <span class="wpr-ladder-track" style="--zero:${zero}%"><i class="wpr-ladder-bar ${cls}" style="${r.c >= 0 ? `left:${zero}%;transform-origin:left` : `right:${100 - zero}%;transform-origin:right`};width:${w}%"></i></span>
          <span class="wpr-ladder-c ${cls}-color">${text}</span>
        </div>`;
    }).join('');
    return `
      <div class="wpr-ladder">
        <div class="wpr-map-rank-h">Today's ${money2(now)} compared with · AAA statewide average</div>
        ${html}
      </div>`;
  }

  function renderStatewide() {
    const fuels = ['regular', 'mid_grade', 'premium', 'diesel'];
    const sw = data.statewide;
    const fuelBtns = fuels.map(f =>
      `<button type="button" aria-pressed="${activeFuel === f}" class="wpr-gas-fuel-btn ${activeFuel === f ? 'active' : ''}" data-fuel="${f}">${fuelLabel(f)}</button>`
    ).join('');

    const series = statewideSeries(activeFuel);
    const story = L.statewideStory(series, activeFuel);
    const colW = frameW() - 2 * padX();
    const chips = story ? [
      story.c7 != null ? ['Past week', story.c7] : null,
      story.c30 != null ? ['Past month', story.c30] : null,
    ].filter(Boolean).map(([label, c]) =>
      `<span class="wpr-st-chip"><b>${label}</b> <span class="${c > 0 ? 'up' : c < 0 ? 'down' : 'flat'}-color">${c === 0 ? 'even' : `${c > 0 ? '+' : '−'}${L.centsText(c / 100)}`}</span></span>`
    ).join('') : '';
    const storyBlock = story ? `
      <div class="wpr-tr wpr-st-story">
        <div class="wpr-tr-kicker">${fuelLabel(activeFuel)} · statewide average · WPR daily tracking</div>
        <h3 class="wpr-tr-title">${esc(story.headline)}</h3>
        <p class="wpr-tr-dek">${esc(story.dek)}${chips ? ` <span class="wpr-st-chips">${chips}</span>` : ''}</p>
        ${buildStateSpark(series, colW)}
      </div>` : '';

    // ── Today's spread: cheapest / average (or a chosen city) / priciest station ──
    const avg = sw?.current_avg?.[activeFuel];
    const low = sw?.low?.[activeFuel];
    const high = sw?.high?.[activeFuel];
    // Station-level extremes, with the city each station is actually in. (These
    // cards once borrowed the city from the AVERAGES and named the wrong place.)
    const ends = L.extremeStations(data?.metros, activeFuel);
    const endSub = (end, cls) => end
      ? `<div class="wpr-state-card-sub"><span class="wpr-pin ${cls}">●</span>${esc(end.city)}</div>`
        + (end.name ? `<div class="wpr-state-card-station">${esc(end.name)}</div>` : '')
      : '';
    const metros = data?.metros || {};
    const cityNames = Object.keys(metros).sort();
    const cityPrice = selectedCity ? metros[selectedCity]?.current_avg?.[activeFuel] : null;
    const pctOf = v => (v != null && low != null && high != null && high > low)
      ? Math.max(0, Math.min(100, ((v - low) / (high - low)) * 100)) : null;
    const markerPct = pctOf(avg) ?? 50;
    const cityMarkerPct = pctOf(cityPrice);
    const middleLabel = selectedCity ? `${esc(selectedCity)} avg` : 'State average';
    const middleValue = selectedCity ? cityPrice : avg;
    const middleVs = (selectedCity && cityPrice != null && avg != null) ? delta(cityPrice, avg, { cents: true }) : null;
    const cityOptions = cityNames.map(n =>
      `<option value="${esc(n)}" ${selectedCity === n ? 'selected' : ''}>${esc(n)}</option>`
    ).join('');

    return `
      <div class="wpr-gas-fuel-row">${fuelBtns}</div>
      ${storyBlock}
      <div class="wpr-state-grid">
        <div class="wpr-state-card">
          <div class="wpr-state-card-label">Cheapest station</div>
          <div class="wpr-state-card-value" style="color:var(--down)">${fmtCents(low)}</div>
          ${endSub(ends.low, 'down-color')}
        </div>
        <div class="wpr-state-card wpr-state-card-feature">
          <div class="wpr-state-card-label">${middleLabel}</div>
          <div class="wpr-state-card-value">${fmtCents(middleValue)}</div>
          ${middleVs
            ? `<div class="wpr-state-card-sub ${middleVs.cls}">${middleVs.text} vs state</div>`
            : '<div class="wpr-state-card-sub">all stations</div>'}
        </div>
        <div class="wpr-state-card">
          <div class="wpr-state-card-label">Priciest station</div>
          <div class="wpr-state-card-value" style="color:var(--up)">${fmtCents(high)}</div>
          ${endSub(ends.high, 'up-color')}
        </div>
      </div>
      <div class="wpr-state-range">
        <div class="wpr-state-range-bar">
          <div class="wpr-state-range-fill"></div>
          <div class="wpr-state-range-marker" style="left:${markerPct}%"></div>
          <span class="wpr-state-range-tag wpr-state-range-tag-state" style="left:${markerPct}%">State $${avg != null ? avg.toFixed(2) : '—'}</span>
          ${cityMarkerPct != null
            ? `<div class="wpr-state-range-marker-city" style="left:${cityMarkerPct}%"></div>
               <span class="wpr-state-range-tag wpr-state-range-tag-city" style="left:${cityMarkerPct}%">${esc(selectedCity)} $${cityPrice.toFixed(2)}</span>`
            : ''}
        </div>
        <div class="wpr-state-range-labels">
          <span>Low $${low != null ? low.toFixed(2) : '—'}</span>
          <span>High $${high != null ? high.toFixed(2) : '—'}</span>
        </div>
      </div>
      <div class="wpr-state-city-select-wrap">
        <select class="wpr-state-city-select" id="citySelect" aria-label="Compare a city to the state average">
          <option value="">Compare a city to the state average…</option>
          ${cityOptions}
        </select>
      </div>
      ${buildChangeLadder()}
      ${renderNeighborStrip()}
      ${renderContextStrip()}
      ${data.summary && data.summary.blurb ? `
        <details class="wpr-summary-wrap">
          <summary>Newsroom summary · a ready-to-quote paragraph</summary>
          <div class="wpr-summary">
            <p class="wpr-summary-text">${esc(data.summary.blurb)}</p>
            <button type="button" class="wpr-summary-copy" aria-label="Copy this summary">Copy</button>
          </div>
        </details>` : ''}
    `;
  }

  // ── Metro Tab ──
  function renderMetro() {
    const fuels = ['regular', 'mid_grade', 'premium', 'diesel'];
    let fuelBtns = fuels.map(f =>
      `<button type="button" aria-pressed="${activeFuel === f}" class="wpr-gas-fuel-btn ${activeFuel === f ? 'active' : ''}" data-fuel="${f}">${fuelLabel(f)}</button>`
    ).join('');

    const metros = data.metros || {};
    const allNames = L.sortMetroNames(metros, data.priority_metros, activeFuel, metroSort);
    const sortBtns = [['featured', 'Featured'], ['cheapest', 'Cheapest first'], ['az', 'A–Z']].map(([mode, label]) =>
      `<button type="button" aria-pressed="${metroSort === mode}" class="wpr-sort-btn ${metroSort === mode ? 'active' : ''}" data-sort="${mode}">${label}</button>`
    ).join('');

    let cards = allNames.map(name => {
      const m = metros[name];
      if (!m) return '';
      const price = m.current_avg?.[activeFuel];
      const low = m.low?.[activeFuel];
      const high = m.high?.[activeFuel];
      const yest = previousReading(name, activeFuel);
      const d = delta(price, yest?.price ?? null, { cents: true });
      const isWausau = name === 'Wausau';
      const rangeText = (low != null && high != null) ? `$${low.toFixed(2)} – $${high.toFixed(2)}` : '';

      // Cheapest specific stations for the active fuel (from the stored list)
      const stations = (m.stations || [])
        .filter(st => st.prices && st.prices[activeFuel] != null)
        .sort((a, b) => a.prices[activeFuel] - b.prices[activeFuel])
        .slice(0, 5);
      const canExpand = stations.length > 0;
      const isExpanded = expandedCity === name && canExpand;

      const stationRows = stations.map((st, i) => `
        <div class="wpr-metro-station">
          <div class="wpr-metro-station-info">
            <span class="wpr-metro-station-name">${esc(st.name)}</span>
            ${st.address ? `<a class="wpr-metro-station-addr" href="${esc(L.mapsUrl(st))}" target="_blank" rel="noopener" title="Open in Google Maps">${esc(st.address)} <span aria-hidden="true">↗</span></a>` : ''}
          </div>
          <span class="wpr-metro-station-price${i === 0 ? ' down-color' : ''}">${fmtCents(st.prices[activeFuel])}</span>
        </div>`).join('');

      return `
        <div class="wpr-metro-item">
          <div class="wpr-metro-card ${isWausau ? 'highlight' : ''}${canExpand ? ' clickable' : ''}${isExpanded ? ' expanded' : ''}"
               ${canExpand ? `data-city="${esc(name)}" role="button" tabindex="0" aria-expanded="${isExpanded}"` : ''}>
            <div>
              <div class="wpr-metro-name">${esc(name)}</div>
              <div class="wpr-metro-range">${rangeText}</div>
            </div>
            <div class="wpr-metro-right">
              ${metroSparkline(name, activeFuel)}
              <div class="wpr-metro-price">${fmtCents(price)}</div>
              <div class="wpr-metro-delta ${d.cls}">${yest != null ? d.text : ''}</div>
              ${canExpand ? `<span class="wpr-metro-expand">${isExpanded ? '▲' : '▼'}</span>` : '<span class="wpr-metro-expand"></span>'}
            </div>
          </div>
          ${isExpanded ? `
            <div class="wpr-metro-stations">
              <div class="wpr-metro-stations-head">Cheapest ${fuelLabel(activeFuel)} near ${esc(name)} · via GasBuddy</div>
              ${stationRows}
            </div>` : ''}
        </div>`;
    }).join('');

    return `
      <div class="wpr-gas-fuel-row">${fuelBtns}</div>
      ${buildMetroMap()}
      ${buildFillUp()}
      <div class="wpr-sort-row" role="group" aria-label="Sort metro areas"><span class="wpr-sort-label">Sort</span>${sortBtns}</div>
      <div class="wpr-metro-list">${cards}</div>
    `;
  }

  // ── Trends Tab ──
  // Wisconsin (WPR's own daily statewide tracking) leads; the EIA Midwest weekly
  // series is a dashed benchmark. Words and tiles come from L.trendStory() so the
  // headline can never contradict the line. Every SVG here is drawn at the pixel
  // width it will occupy (frameW()), so its text is the same size in a 300px
  // phone frame and a 720px desktop one; a fixed 680-wide drawing scaled onto a
  // phone shrank its labels to ~8px. Narrow canvases also get shorter labels.
  const DAY_MS = 864e5;
  const frameW = () => widget.clientWidth || 720;
  const padX = () => (frameW() <= 520 ? 12 : 16);
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const money2 = v => '$' + v.toFixed(2);
  const moneyH = v => '<span class="wpr-dollar">$</span>' + v.toFixed(2);
  const signedCents = d => (d > 0.005 ? '+' : d < -0.005 ? '−' : '±') + L.centsText(d);
  let chartModel = null;   // what wireTrendChart() needs to drive the crosshair

  function trendSeries() {
    const days = trendRange * 7;
    const wiAll = (getWIEntries(activeFuel) || []).map(e => ({ t: e.date.getTime(), price: e.price }));
    const mwAll = (getEIAEntries(activeFuel) || []).map(e => ({ t: e.date.getTime(), price: e.price }));
    const lastT = Math.max(wiAll.length ? wiAll[wiAll.length - 1].t : 0, mwAll.length ? mwAll[mwAll.length - 1].t : 0);
    const start = lastT - days * DAY_MS;
    const wi = wiAll.filter(p => p.t >= start);
    const mw = mwAll.filter(p => p.t >= start);
    // The weekly line starts at the left edge, not at its first in-window week.
    const edge = L.valueAt(mwAll, start);
    const mwDraw = edge != null && (!mw.length || mw[0].t > start) ? [{ t: start, price: edge }, ...mw] : mw;
    return { days, start, end: lastT, wi, mw, mwDraw };
  }

  function niceStep(range) {
    return range <= 0.45 ? 0.1 : range <= 1.2 ? 0.25 : range <= 2.5 ? 0.5 : 1;
  }

  function buildTrendChart(W) {
    const narrow = W < 560;
    const { days, start, end, wi, mw, mwDraw } = trendSeries();
    const story = L.trendStory(wi.length >= 2 ? wi : null, mw, days, activeFuel);
    if (!story) { chartModel = null; return '<div class="wpr-trends-empty">Not enough historical data available.</div>'; }
    const lead = story.leadIsWI ? wi : mwDraw;
    const bench = story.leadIsWI ? mwDraw : [];

    const H = narrow ? 272 : 300;
    const Lp = narrow ? 40 : 48, T = 18, B = 28;
    const R = story.leadIsWI ? (narrow ? 96 : 176) : (narrow ? 74 : 120);
    const fs = 11.5;
    const X = t => Lp + (t - start) / (end - start) * (W - Lp - R);
    const prices = lead.map(p => p.price).concat(bench.map(p => p.price));
    const step = niceStep(Math.max(...prices) - Math.min(...prices));
    const lo = Math.floor(Math.min(...prices) / step) * step;
    const hi = Math.max(Math.ceil(Math.max(...prices) / step) * step, lo + step * 2);
    const Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const path = pts => pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)},${Y(p.price).toFixed(1)}`).join('');

    let svg = '';
    for (let v = lo; v <= hi + 1e-9; v += step) {
      svg += `<line x1="${Lp}" x2="${W - R + 6}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="wpr-tr-grid"/>`
        + `<text x="${Lp - 7}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" class="wpr-tr-ax" style="font-size:${fs}px">${money2(v)}</text>`;
    }
    const d0 = new Date(start);
    let every = narrow && days > 200 ? 2 : 1, n = 0;
    for (let m = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 1)); m.getTime() <= end; m = new Date(Date.UTC(m.getUTCFullYear(), m.getUTCMonth() + 1, 1))) {
      const x = X(m.getTime());
      svg += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${H - B}" y2="${H - B + 4}" class="wpr-tr-tick"/>`;
      if (n++ % every === 0) svg += `<text x="${(x + 3).toFixed(1)}" y="${H - 9}" class="wpr-tr-ax" style="font-size:${fs}px">${MON[m.getUTCMonth()]}</text>`;
    }

    // The gap, both ways: warm where Wisconsin runs above the Midwest, cool where
    // it runs below. Shading only "above" hid the summer, when Wisconsin was the
    // cheaper of the two almost every day.
    const hasGap = { above: false, below: false };
    if (story.leadIsWI && bench.length >= 2) {
      const span = wi.filter(p => L.valueAt(bench, p.t) != null);
      if (span.length >= 2) {
        const pt = (t, v) => `${X(t).toFixed(1)},${Y(v).toFixed(1)}`;
        const mid = span.map(p => pt(p.t, L.valueAt(bench, p.t))).reverse();
        const up = span.map(p => { const m = L.valueAt(bench, p.t); if (p.price > m + 0.005) hasGap.above = true; return pt(p.t, Math.max(p.price, m)); });
        const dn = span.map(p => { const m = L.valueAt(bench, p.t); if (p.price < m - 0.005) hasGap.below = true; return pt(p.t, Math.min(p.price, m)); });
        if (hasGap.above) svg += `<path d="M${up.concat(mid).join('L')}Z" class="wpr-tr-gap"/>`;
        if (hasGap.below) svg += `<path d="M${dn.concat(mid).join('L')}Z" class="wpr-tr-gap-below"/>`;
      }
    }
    const lp = path(lead);
    svg += `<path d="${lp}L${X(lead[lead.length - 1].t).toFixed(1)},${H - B}L${X(lead[0].t).toFixed(1)},${H - B}Z" class="wpr-tr-area"/>`;
    if (bench.length >= 2) svg += `<path d="${path(bench)}" class="wpr-tr-bench"/>`;
    svg += `<path d="${lp}" class="wpr-tr-line wpr-draw" pathLength="1"/>`;
    // The window's sharpest seven-day move, when it is big enough to be news.
    const sharp = story.leadIsWI ? L.sharpestWeek(wi) : null;
    let sharpSince = null;
    if (sharp && Math.abs(sharp.change) >= 0.10) {
      const fullWI = (getWIEntries(activeFuel) || []).map(e => ({ t: e.date.getTime(), price: e.price }));
      sharpSince = L.lastMoveAsBig(fullWI, sharp);
      const seg = wi.filter(p => p.t >= sharp.from.t && p.t <= sharp.to.t);
      const top = Math.min(...seg.map(p => Y(p.price))), bottom = Math.max(...seg.map(p => Y(p.price)));
      // Above the move when there's room under the top of the plot, else below it.
      const ly = top - 22 >= T + 12 ? top - 22 : bottom + 18;
      const cx = Math.min(Math.max((X(sharp.from.t) + X(sharp.to.t)) / 2, Lp + 70), W - R - 70);
      const words = `${signedCents(sharp.change)} in a week`;
      const since = sharpSince ? `biggest since ${L.shortDate(sharpSince)}` : 'biggest WPR has tracked';
      svg += `<path d="${path(seg)}" class="wpr-tr-surge ${sharp.change > 0 ? 'up' : 'down'}"/>`;
      // On a phone there's no room to label it in place; the legend and tile name it.
      if (!narrow) svg += `<text x="${cx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" class="wpr-tr-endlbl wpr-tr-halo" style="font-size:12px">${words}</text>`
        + `<text x="${cx.toFixed(1)}" y="${(ly + 14).toFixed(1)}" text-anchor="middle" class="wpr-tr-note wpr-tr-halo" style="font-size:${fs - 1}px">${since}</text>`;
    } else if (sharp) { sharp.small = true; }

    // Low point
    const lx = X(story.low.t), ly = Y(story.low.price);
    const lowText = `Low ${money2(story.low.price)} · ${L.shortDate(story.low.t)}`;
    // Whichever side of the point has room: never over the y-axis labels or into the gutter.
    const lowLeft = lx + 9 + textW(lowText, fs, 400) > W - R && lx - 9 - textW(lowText, fs, 400) >= Lp;
    svg += `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4" class="wpr-tr-lowdot"/>`
      + `<text x="${(lowLeft ? lx - 9 : lx + 9).toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="${lowLeft ? 'end' : 'start'}" class="wpr-tr-note" style="font-size:${fs}px">${lowText}</text>`;

    // End labels, nudged apart when the two lines finish close together.
    const last = story.last, ex = X(last.t);
    let ey = Y(last.price);
    const leadName = story.leadIsWI ? 'Wisconsin' : 'Midwest';
    const sub = story.isHigh ? (story.covers ? (days > 200 ? '12-month high' : '6-month high') : 'highest tracked')
      : story.isLow ? (story.covers ? (days > 200 ? '12-month low' : '6-month low') : 'lowest tracked') : L.shortDate(last.t);
    svg += `<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="5" class="wpr-tr-enddot"/>`;
    const labelX = (ex + 12).toFixed(1);
    if (story.leadIsWI && story.mwLast) {
      const mx = X(story.mwLast.t), my0 = Y(story.mwLast.price);
      svg += `<circle cx="${mx.toFixed(1)}" cy="${my0.toFixed(1)}" r="4" class="wpr-tr-benchdot"/>`;
      let a = ey, b = my0;
      const minGap = narrow ? 34 : 32;
      if (Math.abs(a - b) < minGap) { const mid = (a + b) / 2, dir = a <= b ? -1 : 1; a = mid + dir * minGap / 2; b = mid - dir * minGap / 2; }
      const two = (y, name, price, note) => narrow
        ? `<text x="${labelX}" y="${(y - 1).toFixed(1)}" class="wpr-tr-endlbl" style="font-size:${fs}px">${name}</text><text x="${labelX}" y="${(y + 13).toFixed(1)}" class="wpr-tr-note" style="font-size:${fs}px">${price}</text>`
        : `<text x="${labelX}" y="${(y - 1).toFixed(1)}" class="wpr-tr-endlbl">${name} ${price}</text><text x="${labelX}" y="${(y + 14).toFixed(1)}" class="wpr-tr-note">${note}</text>`;
      svg += two(a, 'Wisconsin', money2(last.price), sub);
      svg += two(b, 'Midwest', money2(story.mwLast.price), 'EIA, week of ' + L.shortDate(story.mwLast.t));
      if (!narrow && Math.abs(ey - my0) >= 22) {
        const bx = ex + 128;
        svg += `<path d="M${bx - 5},${ey.toFixed(1)}H${bx}V${my0.toFixed(1)}H${bx - 5}" class="wpr-tr-bracket"/>`
          + `<text x="${bx + 5}" y="${((ey + my0) / 2 - 2).toFixed(1)}" class="wpr-tr-endlbl">${signedCents(story.gap)}</text>`
          + `<text x="${bx + 5}" y="${((ey + my0) / 2 + 12).toFixed(1)}" class="wpr-tr-note" style="font-size:10px">gap</text>`;
      }
    } else {
      svg += `<text x="${labelX}" y="${(ey - 1).toFixed(1)}" class="wpr-tr-endlbl" style="font-size:${fs}px">${narrow ? money2(last.price) : `${leadName} ${money2(last.price)}`}</text>`
        + `<text x="${labelX}" y="${(ey + 13).toFixed(1)}" class="wpr-tr-note" style="font-size:${fs}px">${sub}</text>`;
    }

    // Crosshair (driven by wireTrendChart; hidden until hover, tap or arrow keys)
    svg += `<g class="wpr-tr-hover" style="display:none">
        <line class="wpr-tr-cross" y1="${T}" y2="${H - B}"/>
        <circle class="wpr-tr-hdot" r="4.5"/><circle class="wpr-tr-hbench" r="4"/>
        <g class="wpr-tr-tip"><rect rx="6" class="wpr-tr-tipbox"/><text class="wpr-tr-tiptxt"></text></g>
      </g>
      <rect class="wpr-tr-hit" x="${Lp}" y="${T}" width="${W - Lp - R}" height="${H - T - B}" fill="transparent"/>`;

    chartModel = { W, H, T, B, Lp, R, X, Y, lead, bench: story.leadIsWI ? mw : [], leadIsWI: story.leadIsWI, narrow };
    const notes = L.notesInWindow(notesData, start, end, activeFuel);
    let notesSvg = '';
    notes.forEach((n, i) => {
      const x = X(n.t).toFixed(1);
      notesSvg += `<g class="wpr-tr-notemark"><title>${esc(L.shortDate(n.t) + ': ' + n.text)}</title>`
        + `<line x1="${x}" x2="${x}" y1="${T + 9}" y2="${H - B}" class="wpr-tr-noteline"/>`
        + `<circle cx="${x}" cy="${T}" r="8" class="wpr-tr-notedot"/>`
        + `<text x="${x}" y="${T + 3.5}" text-anchor="middle" class="wpr-tr-notenum">${i + 1}</text></g>`;
    });
    // Markers go under the crosshair layer, which is the last thing in the drawing.
    const hoverAt = svg.lastIndexOf('<g class="wpr-tr-hover"');
    if (notesSvg) svg = svg.slice(0, hoverAt) + notesSvg + svg.slice(hoverAt);

    const aria = `${story.headline}. ${story.dek} Use the left and right arrow keys to read values.`;
    return { story, hasGap, notes, sharp: sharp && !sharp.small ? sharp : null, sharpSince, svg: `<svg viewBox="0 0 ${W} ${H}" class="wpr-tr-svg wpr-tr-main" role="img" tabindex="0" aria-label="${esc(aria)}">${svg}</svg>` };
  }

  function renderTrends() {
    const fuels = ['regular', 'mid_grade', 'premium', 'diesel'];
    const ranges = [{ weeks: 26, label: '6 Month' }, { weeks: 52, label: '12 Month' }];
    const fuelBtns = fuels.map(f =>
      `<button type="button" aria-pressed="${activeFuel === f}" class="wpr-gas-fuel-btn ${activeFuel === f ? 'active' : ''}" data-fuel="${f}">${fuelLabel(f)}</button>`
    ).join('');
    const rangeBtns = ranges.map(r =>
      `<button type="button" aria-pressed="${trendRange === r.weeks}" class="wpr-gas-fuel-btn ${trendRange === r.weeks ? 'active' : ''}" data-range="${r.weeks}">${r.label}</button>`
    ).join('');
    const controls = `<div class="wpr-gas-fuel-row wpr-trends-btn-row">${fuelBtns}<span class="wpr-trends-btn-divider"></span>${rangeBtns}</div>`;

    if (!eiaAllData) {
      chartModel = null;
      loadEIAData().then(() => render());
      return controls + '<div class="wpr-trends-empty">Loading historical data…</div>';
    }
    const built = buildTrendChart(frameW() - 2 * padX());
    if (typeof built === 'string') return controls + built;
    const { story, hasGap, notes, sharp, svg } = built;
    const { wi: winWI, mw: winMW } = trendSeries();
    const share = story.leadIsWI ? L.gapShare(winWI, winMW) : null;
    const dek = [story.dek, story.leadIsWI ? L.gapContext(share, story.gap) : ''].filter(Boolean).join(' ');
    const noteKey = notes.length ? `<ol class="wpr-tr-notes">${notes.map(n =>
      `<li><b>${L.shortDate(n.t)}</b> ${esc(n.text)}</li>`).join('')}</ol>` : '';
    const rangeLabel = trendRange === 26 ? 'last 6 months' : 'last 12 months';

    // The chart already labels today, the low and the gap; the tiles add what it
    // can't say at a glance.
    const moveCls = c => (c > 0.005 ? 'up-color' : c < -0.005 ? 'down-color' : '');
    const tiles = story.leadIsWI ? [
      ['wpr-tr-tile-hero', 'Since ' + L.shortDate(story.first.t), `<span class="${moveCls(story.change)}">${signedCents(story.change)}</span>`,
        `${story.change >= 0 ? '+' : '−'}${Math.abs(story.change / story.first.price * 100).toFixed(1)}% · from ${money2(story.first.price)}`],
      sharp
        ? ['', 'Sharpest week', `<span class="${moveCls(sharp.change)}">${signedCents(sharp.change)}</span>`, `${L.shortDate(sharp.from.t)} – ${L.shortDate(sharp.to.t)}`]
        : ['', 'High', moneyH(story.high.price), L.shortDate(story.high.t)],
      share && share.total >= 14
        ? ['', 'Above the Midwest', `${share.above}<span class="wpr-tr-tile-of"> of ${share.total}</span>`, 'days in this stretch']
        : ['', 'Low', moneyH(story.low.price), L.shortDate(story.low.t)],
      ['', 'Range', L.centsText(story.high.price - story.low.price), `${money2(story.low.price)} to ${money2(story.high.price)}`],
    ] : [
      ['wpr-tr-tile-hero', 'Midwest latest', moneyH(story.last.price), 'week of ' + L.shortDate(story.last.t)],
      ['', 'Since ' + L.shortDate(story.first.t), `<span class="${story.change > 0.005 ? 'up-color' : story.change < -0.005 ? 'down-color' : ''}">${signedCents(story.change)}</span>`, `from ${money2(story.first.price)}`],
      ['', 'Low', moneyH(story.low.price), L.shortDate(story.low.t)],
      ['', 'High', moneyH(story.high.price), L.shortDate(story.high.t)],
    ];
    const tileHtml = tiles.map(([cls, label, value, sub]) =>
      `<div class="wpr-tr-tile ${cls}"><div class="wpr-tr-tile-l">${label}</div><div class="wpr-tr-tile-v">${value}</div><div class="wpr-tr-tile-s">${sub}</div></div>`).join('');

    const legend = story.leadIsWI ? `
      <div class="wpr-tr-legend">
        <span><i class="wpr-tr-sw"></i>Wisconsin · WPR daily tracking</span>
        ${story.gap != null ? '<span><i class="wpr-tr-sw wpr-tr-sw-dash"></i>Midwest · U.S. EIA weekly</span>' : ''}
        ${hasGap.above ? '<span><i class="wpr-tr-sw wpr-tr-sw-gap"></i>Wisconsin higher</span>' : ''}
        ${hasGap.below ? '<span><i class="wpr-tr-sw wpr-tr-sw-gap-below"></i>Wisconsin lower</span>' : ''}
        ${sharp ? `<span><i class="wpr-tr-sw wpr-tr-sw-surge ${sharp.change > 0 ? 'up' : 'down'}"></i>Sharpest week</span>` : ''}
      </div>` : `<div class="wpr-tr-legend"><span>U.S. EIA weekly Midwest benchmark</span></div>`;

    return `${controls}
      <div class="wpr-tr">
        <div class="wpr-tr-kicker">${fuelLabel(activeFuel)} · ${rangeLabel}</div>
        <h3 class="wpr-tr-title">${esc(story.headline)}</h3>
        <p class="wpr-tr-dek">${esc(dek)}</p>
        <div class="wpr-tr-tiles">${tileHtml}</div>
        ${legend}
        ${svg}
        <div class="wpr-tr-hint">Hover or tap the chart to read any day.</div>
        ${noteKey}
      </div>`;
  }

  // Crosshair: one readout of both lines at any date — mouse, touch or arrow keys.
  function wireTrendChart() {
    // Only the Price Trends chart has a crosshair. Other charts share the .wpr-tr-svg
    // styling, and wiring one of them with a leftover chartModel threw and skipped the
    // rest of render()'s wiring (the heating tank buttons, the iframe height post).
    const svg = activeTab === 'trends' ? widget.querySelector('.wpr-tr-svg.wpr-tr-main') : null;
    if (!svg || !chartModel) return;
    const m = chartModel, g = svg.querySelector('.wpr-tr-hover'), hit = svg.querySelector('.wpr-tr-hit');
    const cross = g.querySelector('.wpr-tr-cross'), hdot = g.querySelector('.wpr-tr-hdot'), hb = g.querySelector('.wpr-tr-hbench');
    const tip = g.querySelector('.wpr-tr-tip'), box = g.querySelector('.wpr-tr-tipbox'), txt = g.querySelector('.wpr-tr-tiptxt');
    let idx = m.lead.length - 1;
    const NS = 'http://www.w3.org/2000/svg';
    const line = (text, y, cls) => { const t = document.createElementNS(NS, 'tspan'); t.setAttribute('x', 10); t.setAttribute('y', y); if (cls) t.setAttribute('class', cls); t.textContent = text; return t; };
    function show(i) {
      idx = Math.max(0, Math.min(m.lead.length - 1, i));
      const p = m.lead[idx], x = m.X(p.t), y = m.Y(p.price);
      g.style.display = '';
      cross.setAttribute('x1', x); cross.setAttribute('x2', x);
      hdot.setAttribute('cx', x); hdot.setAttribute('cy', y);
      txt.replaceChildren();
      const d = new Date(p.t);
      txt.appendChild(line(`${MON[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`, 18, 'wpr-tr-tip-h'));
      txt.appendChild(line(`${m.leadIsWI ? 'Wisconsin' : 'Midwest'}  ${money2(p.price)}`, 36));
      let rows = 2;
      const w = m.leadIsWI ? L.readingAtOrBefore(m.bench, p.t) : null;
      if (w) {
        hb.style.display = ''; hb.setAttribute('cx', m.X(w.t)); hb.setAttribute('cy', m.Y(w.price));
        txt.appendChild(line(`Midwest  ${money2(w.price)}  (wk of ${L.shortDate(w.t)})`, 53));
        const gap = p.price - w.price;
        txt.appendChild(line(Math.abs(gap) < 0.005 ? 'Level with the Midwest' : `WI ${L.centsText(gap)} ${gap > 0 ? 'above' : 'below'}`, 70, 'wpr-tr-tip-s'));
        rows = 4;
      } else hb.style.display = 'none';
      const bw = m.leadIsWI ? 196 : 130, bh = 12 + rows * 17;
      box.setAttribute('width', bw); box.setAttribute('height', bh);
      const tx = x + 12 + bw > m.W - 4 ? x - 12 - bw : x + 12;
      tip.setAttribute('transform', `translate(${Math.max(m.Lp, tx)},${m.T + 4})`);
    }
    const hide = () => { g.style.display = 'none'; };
    const at = evt => {
      const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
      const sx = pt.matrixTransform(svg.getScreenCTM().inverse()).x;
      let best = 0, bd = Infinity;
      m.lead.forEach((p, i) => { const dd = Math.abs(m.X(p.t) - sx); if (dd < bd) { bd = dd; best = i; } });
      return best;
    };
    hit.addEventListener('pointermove', e => show(at(e)));
    hit.addEventListener('pointerdown', e => show(at(e)));
    hit.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
    svg.addEventListener('keydown', e => {
      const stepBy = m.leadIsWI ? 1 : 1;
      if (e.key === 'ArrowLeft') { e.preventDefault(); show(idx - stepBy); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); show(idx + stepBy); }
      else if (e.key === 'Home') { e.preventDefault(); show(0); }
      else if (e.key === 'End') { e.preventDefault(); show(m.lead.length - 1); }
      else if (e.key === 'Escape') hide();
    });
    svg.addEventListener('blur', hide);
  }

  // ── Metro map + strip plot ──
  // Color answers one question — above or below the state average for the active
  // fuel — diverging cool (cheaper) / gray (within 5¢) / warm (pricier).
  const BIN_COLORS = ['#2d6259', '#7fb3aa', '#cfcfca', '#e39a88', '#b3362a'];
  const FUEL_WORD = { regular: 'regular gas', mid_grade: 'mid-grade', premium: 'premium', diesel: 'diesel' };

  // "An 87¢ spread", "a 61¢ spread": the article follows how the figure is spoken.
  const spreadPhrase = c => (/^(8\d?|11|18)¢/.test(c) ? "An " : "A ") + c;

  // Label collision needs real text widths; a per-character guess overstates
  // them and pushed every candidate spot off the map.
  const measureCtx = document.createElement('canvas').getContext('2d');
  function textW(str, size, weight = 700) {
    measureCtx.font = `${weight} ${size}px "DM Sans", sans-serif`;
    return measureCtx.measureText(str).width * 1.04;
  }

  function buildMetroMap() {
    const outline = self.WPR_WI_OUTLINE;
    const avg = data.statewide?.current_avg?.[activeFuel];
    if (!outline || typeof avg !== 'number') return '';
    const ranked = L.rankMetros(data.metros, activeFuel, avg).filter(r => L.CITY_COORDS[r.name]);
    if (ranked.length < 3) return '';
    const cheap = ranked[0], dear = ranked[ranked.length - 1];
    const me = ranked.find(r => r.name === 'Wausau');
    const [VW, VH] = outline.viewBox;
    // The side column (rankings + callout) sits beside the map above 640px.
    const colW = frameW() - 2 * padX(), mapW = frameW() > 640 ? colW - 204 : Math.min(colW, 440);
    const u = VW / mapW, narrow = mapW < 400;   // viewBox units per screen px
    const fs = 11.5 * u, r = 7.5 * u;
    const pos = {};
    ranked.forEach(m => { pos[m.name] = L.projectWI(L.CITY_COORDS[m.name][0], L.CITY_COORDS[m.name][1], outline.proj); });

    let svg = `<path d="${outline.path}" class="wpr-map-land"/>`;
    const [lkx, lky] = L.projectWI(43.55, -86.95, outline.proj);
    svg += `<text x="${lkx.toFixed(0)}" y="${lky.toFixed(0)}" class="wpr-map-water" text-anchor="middle" style="font-size:${fs - 1}px">Lake</text><text x="${lkx.toFixed(0)}" y="${(lky + fs + 1).toFixed(0)}" class="wpr-map-water" text-anchor="middle" style="font-size:${fs - 1}px">Michigan</text>`;

    // Boxes already taken (labels, dots, the ring caption) so labels never collide.
    const taken = ranked.map(m => { const [x, y] = pos[m.name]; return { x0: x - r - 2, x1: x + r + 2, y0: y - r - 2, y1: y + r + 2, own: m.name }; });
    const lakeW = textW('Michigan', fs - 1, 400);   // the water label is occupied space too
    taken.push({ x0: lkx - lakeW / 2, x1: lkx + lakeW / 2, y0: lky - fs, y1: lky + fs + 4, own: '' });
    const clear = (b, own) => b.x0 >= 2 && b.x1 <= VW - 2 && b.y0 >= 2 && b.y1 <= VH - 2
      && !taken.some(t => t.own !== own && !(b.x1 < t.x0 || b.x0 > t.x1 || b.y1 < t.y0 || b.y0 > t.y1));

    // Ring the central region when it holds most of the priciest metros.
    const share = L.centralShare(ranked);
    if (share.count >= 4) {
      const pts = L.CENTRAL_WI.filter(n => pos[n]).map(n => pos[n]);
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
      const rx = (Math.max(...xs) - Math.min(...xs)) / 2 + 24, ry = (Math.max(...ys) - Math.min(...ys)) / 2 + 22;
      svg += `<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" class="wpr-map-ring wpr-map-today"/>`;
      const cap1 = narrow ? 'Central WI' : 'Central Wisconsin';
      const cap2 = share.count === share.of ? `all ${share.of} priciest${narrow ? '' : ' metros'}`
        : narrow ? `${share.count} of ${share.of} priciest` : `${share.count} of the ${share.of} priciest metros`;
      const cw = Math.max(textW(cap1, fs), textW(cap2, fs - 0.5, 400));
      // First spot (two lines of text) that clears every dot: below-left, below-right, left, right.
      const spots = [
        [cx - rx * 0.62, cy + ry * 0.86 + fs, 'end'], [cx + rx * 0.62, cy + ry * 0.86 + fs, 'start'],
        [cx - rx - 6, cy - fs * 0.4, 'end'], [cx + rx + 6, cy - fs * 0.4, 'start'],
        [cx - rx * 0.55, cy - ry - fs - 8, 'end'], [cx + rx * 0.55, cy - ry - fs - 8, 'start'],
      ];
      const box = ([x, y, a]) => ({ x0: a === 'end' ? x - cw : x, x1: a === 'end' ? x : x + cw, y0: y - fs, y1: y + fs + 4, own: '' });
      const spot = spots.find(sp => clear(box(sp), '')) || spots[0];
      const [capX, capY, capA] = spot;
      svg += `<text x="${capX.toFixed(1)}" y="${capY.toFixed(1)}" text-anchor="${capA}" class="wpr-map-lbl wpr-map-today" style="font-size:${fs}px">${cap1}</text>`
        + `<text x="${capX.toFixed(1)}" y="${(capY + fs + 2).toFixed(1)}" text-anchor="${capA}" class="wpr-map-sub wpr-map-today" style="font-size:${fs - 0.5}px">${cap2}</text>`;
      taken.push(box(spot));
    }

    // Dots: Wausau ringed; every dot is a button that opens its city in the list.
    ranked.slice().sort((a, b) => L.CITY_COORDS[b.name][0] - L.CITY_COORDS[a.name][0]).forEach(m => {
      const [x, y] = pos[m.name], rel = m.price - avg;
      const desc = `${m.name} ${money2(m.price)}, ${Math.abs(rel) < 0.005 ? 'at' : L.centsText(rel) + (rel > 0 ? ' above' : ' below')} the state average`;
      if (m.name === 'Wausau') svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r + 4}" class="wpr-map-me"/>`;
      svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${BIN_COLORS[m.bin]}" class="wpr-map-dot" data-city="${esc(m.name)}" tabindex="0" role="button" aria-label="${esc(desc)}"><title>${esc(desc)}</title></circle>`;
    });

    // Labels: Wausau, the two extremes, then the big metros — each placed where it fits.
    const want = ['Wausau', cheap.name, dear.name, 'Superior', 'Eau Claire', 'La Crosse', 'Green Bay', 'Madison', 'Milwaukee', 'Rhinelander'];
    const seen = new Set();
    for (const name of want) {
      if (seen.has(name) || !pos[name]) continue;
