<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Wisconsin Gas Prices — Social Card</title>
<!-- A 1080×1080 square for Facebook/Instagram, rendered to docs/social.png by
     scripts/render-digest.mjs on every update run (same as the newsletter digest).
     It is an IMAGE for social posts, not a data cache. Fonts are non-blocking and
     body[data-ready] is set once everything is drawn (or the error card shows). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@700;800;900&family=Source+Sans+3:wght@600;700&display=swap">
<style>
  :root {
    --ink:#1a1a1a; --ink-mid:#444; --ink-light:#5f5f5f;
    --paper:#ffffff; --paper-warm:#f0f5f4; --rule:#dfe9e7;
    --accent:#3e847a; --accent-light:#5ab8ad; --accent-pale:#e0f2ef; --accent-dark:#2d6259;
    --up:#b3362a; --down:#2d6259;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#e9edec; font-family:'DM Sans',-apple-system,sans-serif; font-variant-numeric:lining-nums tabular-nums; }
  .social-card { width:1080px; height:1080px; background:var(--paper); color:var(--ink); display:flex; flex-direction:column; overflow:hidden; }

  .sc-head { background:var(--ink); color:#fff; padding:34px 60px 40px; display:flex; align-items:center; gap:30px; position:relative; }
  .sc-head::after { content:''; position:absolute; left:0; right:0; bottom:0; height:10px; background:linear-gradient(90deg,var(--accent),var(--accent-light)); }
  .sc-logo { width:112px; height:112px; border-radius:50%; border:4px solid rgba(255,255,255,0.18); flex:none; }
  .sc-kicker { font-size:24px; font-weight:700; letter-spacing:5px; text-transform:uppercase; color:var(--accent-light); }
  .sc-title { font-family:'Playfair Display',Georgia,serif; font-size:56px; white-space:nowrap; font-weight:800; line-height:1.05; margin-top:4px; }
  .sc-date { margin-left:auto; text-align:right; white-space:nowrap; font-size:26px; color:rgba(255,255,255,0.75); font-weight:500; line-height:1.3; }

  .sc-body { flex:1; min-height:0; padding:38px 60px 0; display:flex; flex-direction:column; }
  .sc-label { font-size:26px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--accent-dark); }
  .sc-hero { display:flex; align-items:flex-end; gap:36px; margin-top:6px; }
  .sc-price { font-family:'Playfair Display',Georgia,serif; font-size:184px; font-weight:800; line-height:0.92; letter-spacing:-3px; }
  .sc-cur { font-family:'Source Sans 3',sans-serif; font-weight:700; font-size:0.5em; vertical-align:0.62em; margin-right:6px; letter-spacing:0; }
  .sc-per { font-size:30px; color:var(--ink-light); margin-bottom:22px; }
  .sc-headline { font-family:'Playfair Display',Georgia,serif; font-size:50px; font-weight:700; line-height:1.15; margin-top:24px; }
  .sc-dek { font-size:30px; color:var(--ink-mid); margin-top:10px; line-height:1.35; }
  .up { color:var(--up); } .down { color:var(--down); }
  .sc-spark { margin-top:22px; }

  .sc-tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:auto; }
  .sc-tile { border:2px solid var(--rule); border-radius:14px; padding:20px 22px 22px; background:var(--paper-warm); }
  .sc-tile.me { background:var(--accent-pale); border-color:var(--accent-light); }
  .sc-tile-l { font-size:21px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-light); }
  .sc-tile.me .sc-tile-l { color:var(--accent-dark); }
  .sc-tile-v { font-family:'Playfair Display',Georgia,serif; font-size:56px; font-weight:800; margin-top:6px; line-height:1; }
  .sc-tile-s { font-size:24px; color:var(--ink-mid); margin-top:6px; }

  .sc-foot { display:flex; justify-content:space-between; align-items:center; gap:20px; white-space:nowrap; padding:24px 60px 30px; font-size:21px; color:var(--ink-light); }
  .sc-foot b { color:var(--accent-dark); font-weight:700; }
  .sc-unavail { margin:auto; font-size:40px; color:var(--ink-light); text-align:center; padding:60px; }
</style>
</head>
<body>
<div class="social-card" id="card"><div class="sc-unavail">Loading…</div></div>
<script src="./widget-logic.js?v=10"></script>
<script>
(function () {
  'use strict';
  var card = document.getElementById('card');
  function done() { document.body.setAttribute('data-ready', '1'); }
  function bust() { return '?t=' + Math.floor(Date.now() / 600000); }
  // 15s cap per fetch so a hung request still reaches data-ready (the renderer waits on it).
  function getJson(url) {
    var opts = AbortSignal.timeout ? { signal: AbortSignal.timeout(15000) } : {};
    return fetch(url, opts).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function money(p) { return '$' + p.toFixed(2); }
  function longDate(mmddyy) {
    var m = /^(\d{2})\/(\d{2})\/(\d{2})$/.exec(mmddyy || '');
    var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    return m ? months[(+m[1]) - 1] + ' ' + (+m[2]) + ', 20' + m[3] : (mmddyy || '');
  }
  function unavailable() {
    card.innerHTML = '<div class="sc-unavail">Wisconsin gas prices are temporarily unavailable.</div>';
    done();
  }

  // 30-day statewide line, drawn for this 960px-wide card.
  function spark(series) {
    var lastT = series[series.length - 1].t;
    var pts = series.filter(function (p) { return p.t >= lastT - 30 * 864e5; });
    if (pts.length < 5) return '';
    var W = 960, H = 190, T = 16, B = 40, R = 150;
    var lo = Math.min.apply(null, pts.map(function (p) { return p.price; }));
    var hi = Math.max.apply(null, pts.map(function (p) { return p.price; }));
    var pad = Math.max((hi - lo) * 0.15, 0.02), t0 = pts[0].t;
    function X(t) { return (t - t0) / ((lastT - t0) || 1) * (W - R); }
    function Y(v) { return T + (1 - (v - (lo - pad)) / ((hi - lo) + 2 * pad)) * (H - T - B); }
    var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(p.t).toFixed(1) + ',' + Y(p.price).toFixed(1); }).join('');
    var last = pts[pts.length - 1], first = pts[0];
    var short = function (t) { var x = new Date(t); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][x.getUTCMonth()] + ' ' + x.getUTCDate(); };
    return '<svg class="sc-spark" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">'
      + '<path d="' + d + 'L' + X(lastT).toFixed(1) + ',' + (H - B) + 'L0,' + (H - B) + 'Z" fill="rgba(62,132,122,0.10)"/>'
      + '<line x1="0" x2="' + (W - R + 10) + '" y1="' + (H - B) + '" y2="' + (H - B) + '" stroke="#c9cccc" stroke-width="2"/>'
      + '<path d="' + d + '" fill="none" stroke="#2d6259" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>'
      + '<circle cx="' + X(last.t).toFixed(1) + '" cy="' + Y(last.price).toFixed(1) + '" r="11" fill="#2d6259" stroke="#fff" stroke-width="4"/>'
      + '<text x="' + (X(last.t) + 24).toFixed(1) + '" y="' + (Y(last.price) + 11).toFixed(1) + '" font-family="DM Sans,sans-serif" font-size="32" font-weight="700" fill="#1a1a1a">' + money(last.price) + '</text>'
      + '<text x="0" y="' + (H - 6) + '" font-family="DM Sans,sans-serif" font-size="24" fill="#5f5f5f">' + short(first.t) + '</text>'
      + '<text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end" font-family="DM Sans,sans-serif" font-size="24" fill="#5f5f5f">Past 30 days · ' + short(last.t) + '</text>'
      + '</svg>';
  }

  function render(data, hist) {
    var L = self.WprGasLogic;
    var avg = data && data.statewide && data.statewide.current_avg && data.statewide.current_avg.regular;
    if (!L || typeof avg !== 'number') return unavailable();

    var series = [];
    L.sortedHistoryKeys(hist || {}).forEach(function (k) {
      var v = hist[k] && hist[k].statewide && hist[k].statewide.regular;
      if (typeof v === 'number') series.push({ t: L.historyKeyTime(k), price: v });
    });
    var story = L.statewideStory(series, 'regular');
    var headline = story ? story.headline : 'Wisconsin regular gas';
    // The big number above already says the price; the dek adds the record line.
    var dek = story && story.extreme ? story.dek.replace(/^\$[\d.]+ a gallon today, /, '').replace(/^./, function (c) { return c.toUpperCase(); }) : '';
    var cls = story && story.c7 != null ? (story.c7 > 0 ? 'up' : story.c7 < 0 ? 'down' : '') : '';

    var ranked = L.rankMetros(data.metros || {}, 'regular', avg);
    var me = ranked.filter(function (m) { return m.name === 'Wausau'; })[0];
    var tile = function (label, m, extra, mine) {
      return m ? '<div class="sc-tile' + (mine ? ' me' : '') + '"><div class="sc-tile-l">' + label + '</div>'
        + '<div class="sc-tile-v">' + money(m.price) + '</div><div class="sc-tile-s">' + esc(extra || m.name) + '</div></div>' : '';
    };
    var meRel = me ? (Math.abs(me.price - avg) < 0.005 ? 'at the state average' : L.centsText(me.price - avg) + (me.price > avg ? ' above' : ' below') + ' state') : '';

    card.innerHTML =
      '<div class="sc-head"><img class="sc-logo" src="./wpr-logo.jpg" alt="">'
      + '<div><div class="sc-kicker">Fuel Watch</div><div class="sc-title">Wisconsin Gas Prices</div></div>'
      + '<div class="sc-date">' + esc(longDate(data.price_date)) + '<br>Regular unleaded</div></div>'
      + '<div class="sc-body">'
      + '<div class="sc-label">Statewide average</div>'
      + '<div class="sc-hero"><div class="sc-price"><span class="sc-cur">$</span>' + avg.toFixed(2) + '</div><div class="sc-per">a gallon</div></div>'
      + '<div class="sc-headline ' + cls + '">' + esc(headline) + '</div>'
      + (dek ? '<div class="sc-dek">' + esc(dek) + '</div>' : '')
      + (series.length ? spark(series) : '')
      + '<div class="sc-tiles">'
      + tile('Wausau', me, meRel, true)
      + tile('Cheapest metro', ranked[0])
      + tile('Priciest metro', ranked[ranked.length - 1])
      + '</div></div>'
      + '<div class="sc-foot"><span>Live prices for 22 Wisconsin cities: <b>wausaupilotandreview.com</b></span><span>Data: GasBuddy, WPR tracking</span></div>';
    done();
  }

  Promise.all([getJson('./gas_prices.json' + bust()), getJson('./gas_prices_history.json' + bust())])
    .then(function (r) { r[0] ? render(r[0], r[1]) : unavailable(); })
    .catch(unavailable);
})();
</script>
</body>
</html>
