<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wisconsin Gas Prices — Wausau Pilot &amp; Review</title>
<meta name="description" content="Current Wisconsin gas prices by metro area, statewide averages, from Wausau Pilot &amp; Review.">
<meta property="og:type" content="website">
<meta property="og:title" content="Wisconsin Gas Prices — Wausau Pilot &amp; Review">
<meta property="og:description" content="Current Wisconsin gas prices by metro area and statewide averages.">
<meta property="og:url" content="https://rowanflynnpilot.github.io/wpr-gas-prices/index-compact.html">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap">
</noscript>
<style>

  :root {
    --ink: #1a1a1a;
    --ink-mid: #444;
    --ink-light: #6b6b6b;
    --ink-faint: #6a6a6a;
    --paper: #f9fafb;
    --paper-warm: #f0f5f4;
    --rule: #c8d8d5;
    --rule-light: #dfe9e7;
    --accent: #3e847a;
    --accent-light: #5ab8ad;
    --accent-pale: #e0f2ef;
    --accent-dark: #2d6259;
    --up: #c0392b;
    --down: #27864a;
    --neutral: #888;
    --radius: 6px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .wpr-compact {
    font-variant-numeric: lining-nums tabular-nums;
    font-family: 'DM Sans', -apple-system, sans-serif;
    background: var(--paper);
    color: var(--ink);
    max-width: 360px;
    margin: 0 auto;
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    overflow: hidden;
    line-height: 1.4;
  }

  /* Header */
  .wpr-c-header {
    background: var(--ink);
    color: #fff;
    padding: 14px 16px 12px;
    position: relative;
    text-align: center;
  }
  .wpr-c-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
  }
  .wpr-c-logo {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    margin: 0 auto 8px;
    display: block;
    border: 2px solid rgba(255,255,255,0.15);
  }
  .wpr-c-kicker {
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--accent-light);
    margin-bottom: 2px;
  }
  .wpr-c-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.15;
  }
  .wpr-c-date {
    font-size: 10px;
    color: rgba(255,255,255,0.4);
    margin-top: 4px;
    font-style: italic;
  }
  .wpr-c-date-stale { color: #f0b65a; font-style: normal; }
  .wpr-c-unavailable { text-align: center; padding: 40px 16px; color: var(--ink-light); font-size: 13px; line-height: 1.7; }

  /* Hero price */
  .wpr-c-hero {
    padding: 10px 16px 8px;
    border-bottom: 1px solid var(--rule-light);
  }
  .wpr-c-hero-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .wpr-c-spark { flex: none; text-align: right; }
  .wpr-c-spark svg { display: block; }
  .wpr-c-spark-cap { font-size: 9px; color: var(--ink-faint); margin-top: 1px; }
  .wpr-c-headline {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 13px; font-weight: 700; line-height: 1.25; margin-top: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .wpr-c-hero-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--ink-faint);
    margin-bottom: 2px;
  }
  .wpr-c-hero-price {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 36px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.1;
  }
  .wpr-c-hero-change {
    font-size: 11px;
    font-weight: 600;
    margin-top: 3px;
  }
  .wpr-dollar { font-family: 'Source Sans 3', sans-serif; font-weight: inherit; }

  /* Fuel pills */
  .wpr-c-fuels {
    display: flex;
    gap: 4px;
    padding: 10px 10px 8px;
    justify-content: center;
  }
  .wpr-c-fuel-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 100px;
    border: 1px solid var(--rule);
    background: #fff;
    color: var(--ink-mid);
    cursor: pointer;
    transition: all 0.15s;
  }
  .wpr-c-fuel-btn:hover { border-color: var(--accent); color: var(--accent); }
  .wpr-c-fuel-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* Metro list */
  .wpr-c-metro-list { padding: 0 10px 6px; }
  .wpr-c-metro-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 10px;
    border-bottom: 1px solid var(--rule-light);
    border-radius: 6px;
    margin: 2px 0;
    transition: background 0.12s;
  }
  .wpr-c-metro-row:hover { background: var(--paper-warm); }
  .wpr-c-metro-row:last-child { border-bottom: none; }
  .wpr-c-metro-row.highlight { background: var(--accent-pale); }
  .wpr-c-metro-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
  }
  .wpr-c-metro-right {
    text-align: right;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .wpr-c-metro-price {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
  }
  .wpr-c-metro-delta {
    font-size: 10px;
    font-weight: 600;
    min-width: 52px;
    text-align: right;
  }
  .up-color { color: var(--up); }
  .down-color { color: var(--down); }
  .flat-color { color: var(--neutral); }

  /* CTA link */
  .wpr-c-cta {
    display: block;
    text-align: center;
    padding: 10px;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    border-top: 1px solid var(--rule-light);
    transition: background 0.12s;
  }
  .wpr-c-cta:hover { background: var(--accent-pale); }

  /* Footer */
  .wpr-c-footer {
    padding: 8px 12px;
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 9px;
    color: var(--ink-faint);
    background: var(--paper-warm);
  }
  .wpr-c-footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .wpr-c-footer a:hover { text-decoration: underline; }

  .wpr-c-loading {
    text-align: center;
    padding: 40px 12px;
    color: var(--ink-faint);
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="wpr-compact" id="gasWidget">
  <div class="wpr-c-loading">Loading gas prices…</div>
</div>
<noscript>
  <div class="wpr-compact" style="text-align:center;padding:36px 16px;color:var(--ink-light);font-family:'DM Sans',sans-serif;">
    This widget needs JavaScript. See current prices at
    <a href="https://www.gasbuddy.com/gasprices/wisconsin" style="color:var(--accent)">GasBuddy</a>.
  </div>
</noscript>

<!-- Shared, unit-tested logic. Bump ?v= whenever its API changes (see the file's header). -->
<script src="./widget-logic.js?v=10"></script>
<script>
(function() {
  'use strict';

  const DATA_URL = 'https://rowanflynnpilot.github.io/wpr-gas-prices/gas_prices.json';
  const HISTORY_URL = 'https://rowanflynnpilot.github.io/wpr-gas-prices/gas_prices_history.json';
  const FULL_PAGE_URL = 'https://wausaupilotandreview.com/wausau-gas-price-tracker/';
  // Cache-bust in 10-min buckets so the GitHub Pages CDN doesn't serve stale JSON.
  const cacheBust = () => '?t=' + Math.floor(Date.now() / 600000);
  // Every fetch gives up after 15s so a hung request shows the honest
  // "unavailable" state instead of "Loading…" forever (kept in sync with index.html).
  const fetchJson = url => fetch(url, { signal: AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined })
    .then(r => r.ok ? r.json() : null).catch(() => null);
  const WPR_LOGO = './wpr-logo.jpg';   // shared with the digest and social cards; cached once


  const PRIORITY_METROS = ['Wausau', 'Eau Claire', 'Green Bay', 'Appleton', 'Madison', 'Milwaukee-Waukesha'];

  let data = null;
  let historyData = null;
  let activeFuel = 'regular';
  const widget = document.getElementById('gasWidget');

  // Every figure shows cents, matching index.html.
  function fmtCents(p) {
    if (p == null) return '—';
    return '<span class="wpr-dollar">$</span>' + p.toFixed(2);
  }
  function fuelLabel(k) {
    return { regular: 'Regular', mid_grade: 'Mid-Grade', premium: 'Premium', diesel: 'Diesel' }[k] || k;
  }

  // Pure logic is shared with index.html via widget-logic.js (tested by
  // tests/widget-logic.test.mjs); these bind it to this widget's state.
  if (!self.WprGasLogic) {
    widget.innerHTML = '<div class="wpr-c-unavailable">Live prices are temporarily unavailable.<br>Please check back shortly.</div>';
    return;
  }
  const L = self.WprGasLogic;
  const esc = L.esc;
  const delta = L.delta;
  const previousReading = (key, fuel) => L.previousReading(historyData, data && data.price_date, key, fuel);
  const comparisonLabel = prevKey => L.comparisonLabel(data && data.price_date, prevKey);
  const freshnessLabel = () => L.freshness(data.scraped_at, data.price_date, Date.now());

  // Tell the embedding page our current height so the iframe can auto-fit
  // (docs/embed.js listens). Posts now AND on the next frame: background tabs
  // never run requestAnimationFrame, so a rAF-only post leaves a WordPress page
  // opened in a background tab stuck at the iframe's fallback height.
  function sendHeight() {
    const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h > 0) window.parent.postMessage({ type: 'wpr-gas-height', height: h }, '*');
  }
  function postHeight() {
    if (window.parent === window) return;
    sendHeight();
    requestAnimationFrame(sendHeight);
  }
  // embed.js pings when it attaches: this iframe can finish rendering before the
  // host page's async script is listening, and would otherwise never re-post.
  window.addEventListener('message', e => {
    if (e.source === window.parent && e.data === 'wpr-gas-height?') postHeight();
  });

  function renderError() {
    widget.innerHTML = `
      <div class="wpr-c-header">
        <img src="${WPR_LOGO}" alt="WPR" class="wpr-c-logo" />
        <div class="wpr-c-kicker">Fuel Watch</div>
        <div class="wpr-c-title">Wisconsin Gas Prices</div>
      </div>
      <div class="wpr-c-unavailable">
        Live prices are temporarily unavailable.<br>Please check back shortly.
      </div>
      <div class="wpr-c-footer">
        <span>Data via <a href="https://www.gasbuddy.com/gasprices/wisconsin" target="_blank" rel="noopener">GasBuddy</a></span>
        <span>WPR</span>
      </div>`;
    postHeight();
  }

  // Statewide daily readings for one fuel from our history, [{ t, price }].
  function statewideSeries(fuel) {
    if (!historyData) return [];
    return L.sortedHistoryKeys(historyData)
      .map(k => ({ t: L.historyKeyTime(k), price: historyData[k]?.statewide?.[fuel] }))
      .filter(p => typeof p.price === 'number');
  }
  // A 30-day line beside the price, colored by the month's direction.
  function sparkline(series) {
    if (series.length < 5) return '';
    const lastT = series[series.length - 1].t;
    const pts = series.filter(p => p.t >= lastT - 30 * 864e5);
    if (pts.length < 5) return '';
    const w = 104, h = 34, pad = 3;
    const lo = Math.min(...pts.map(p => p.price)), hi = Math.max(...pts.map(p => p.price)), r = (hi - lo) || 1;
    const c = pts.map((p, i) => `${(pad + i * (w - 2 * pad) / (pts.length - 1)).toFixed(1)},${(pad + (h - 2 * pad) * (1 - (p.price - lo) / r)).toFixed(1)}`);
    const change = Math.round((pts[pts.length - 1].price - pts[0].price) * 100);
    const color = change > 0 ? 'var(--up)' : change < 0 ? 'var(--down)' : 'var(--accent)';
    const [ex, ey] = c[c.length - 1].split(',');
    return `<div class="wpr-c-spark"><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Statewide price over the last 30 days">`
      + `<polyline points="${c.join(' ')}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`
      + `<circle cx="${ex}" cy="${ey}" r="2.6" fill="${color}"/></svg>`
      + `<div class="wpr-c-spark-cap">30 days · <b style="color:${color}">${change > 0 ? '+' : change < 0 ? '−' : '±'}${L.centsText(change / 100)}</b></div></div>`;
  }

  function render() {
    if (!data) { renderError(); return; }
    const fresh = freshnessLabel();
    const sw = data.statewide;
    const price = sw.current_avg?.[activeFuel];
    const yest = previousReading('statewide', activeFuel);
    const d = delta(price, yest?.price ?? null, { cents: true });
    const heroCompare = yest ? comparisonLabel(yest.key) : 'vs previous';
    // The full widget's headline, shortened to one line: "Regular gas is up 30¢ in a week".
    const series = statewideSeries(activeFuel);
    const story = L.statewideStory(series, activeFuel);
    const headline = story ? story.headline.replace(/^Wisconsin (.)/, (m, c) => c.toUpperCase()) : '';
    const metros = data.metros || {};
    const priority = data.priority_metros || PRIORITY_METROS;

    // Show only priority metros
    const sorted = priority.filter(n => metros[n]);

    let fuelBtns = ['regular','mid_grade','premium','diesel'].map(f =>
      `<button type="button" aria-pressed="${activeFuel===f}" class="wpr-c-fuel-btn ${activeFuel===f?'active':''}" data-fuel="${f}">${fuelLabel(f)}</button>`
    ).join('');

    let metroRows = sorted.map(name => {
      const m = metros[name];
      const mp = m.current_avg?.[activeFuel];
      const my = previousReading(name, activeFuel);
      const md = delta(mp, my?.price ?? null, { cents: true });
      const isWausau = name === 'Wausau';
      return `
        <div class="wpr-c-metro-row ${isWausau ? 'highlight' : ''}">
          <span class="wpr-c-metro-name">${esc(name)}</span>
          <div class="wpr-c-metro-right">
            <span class="wpr-c-metro-price">${fmtCents(mp)}</span>
            <span class="wpr-c-metro-delta ${md.cls}">${md.text}</span>
          </div>
        </div>`;
    }).join('');

    widget.innerHTML = `
      <div class="wpr-c-header">
        <img src="${WPR_LOGO}" alt="WPR" class="wpr-c-logo" />
        <div class="wpr-c-kicker">Fuel Watch</div>
        <div class="wpr-c-title">Wisconsin Gas Prices</div>
        <div class="wpr-c-date${fresh.stale ? ' wpr-c-date-stale' : ''}" title="${fresh.title}">${fresh.text}</div>
      </div>
      <div class="wpr-c-hero">
        <div class="wpr-c-hero-row">
          <div>
            <div class="wpr-c-hero-label">State Avg · ${fuelLabel(activeFuel)}</div>
            <div class="wpr-c-hero-price">${fmtCents(price)}</div>
            <div class="wpr-c-hero-change ${d.cls}">${d.text} ${heroCompare}</div>
          </div>
          ${sparkline(series)}
        </div>
        ${headline ? `<div class="wpr-c-headline" title="${esc(headline)}">${esc(headline)}</div>` : ''}
      </div>
      <div class="wpr-c-fuels">${fuelBtns}</div>
      <div class="wpr-c-metro-list">${metroRows}</div>
      <a href="${FULL_PAGE_URL}" target="_blank" rel="noopener" class="wpr-c-cta">View full dashboard & trends →</a>
      <div class="wpr-c-footer">
        <span>Data via <a href="https://www.gasbuddy.com/gasprices/wisconsin" target="_blank" rel="noopener">GasBuddy</a></span>
        <span>WPR</span>
      </div>
    `;

    widget.querySelectorAll('.wpr-c-fuel-btn').forEach(btn => {
      btn.addEventListener('click', () => { activeFuel = btn.dataset.fuel; render(); });
    });
    postHeight();
  }

  async function init() {
    try {
      const [json, hist] = await Promise.all([
        fetchJson(DATA_URL + cacheBust()),
        fetchJson(HISTORY_URL + cacheBust()),
      ]);
      if (!json) throw new Error('data unavailable');
      data = json;
      historyData = hist;
    } catch (err) {
      console.warn('Gas price data unavailable:', err.message);
      data = null;
    }
    render();
  }

  window.addEventListener('resize', postHeight);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(postHeight);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
